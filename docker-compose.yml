services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: marketshark
      POSTGRES_PASSWORD: marketshark
      POSTGRES_DB: marketshark
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketshark"]
      interval: 5s
      retries: 12

  api:
    build:
      context: ./services/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://marketshark:marketshark@db:5432/marketshark
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
