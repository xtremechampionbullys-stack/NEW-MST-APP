al":null,"source":"synthetic","is_synthetic":true,"days_away":89,"is_upcoming":true,"is_confirmed":false}],"reports_earnings":true},"categories":[{"id":"advanced","label":"Advanced / Ratio","count":4},{"id":"calendar","label":"Calendars & Diagonals","count":3},{"id":"directional","label":"Directional","count":4},{"id":"hedging","label":"Hedging","count":2},{"id":"income","label":"Income","count":2},{"id":"leaps","label":"LEAPS & Stock Replacement","count":2},{"id":"neutral","label":"Neutral / Range","count":5},{"id":"premium-selling","label":"Premium Selling","count":4},{"id":"vertical","label":"Vertical Spreads","count":4},{"id":"volatility","label":"Volatility","count":4}],"templates":{"bear_put_spread":{"id":"bear_put_spread","name":"Bear Put Spread","category":"vertical","outlook":"bearish","complexity":"beginner","summary":"Buy a put, sell a lower one. Defined-risk bearish for a fraction of the naked put cost.","mechanics":"Max profit is the width minus the debit at or below the short strike; max loss is the debit. Selling the lower strike recovers much of the skew premium you paid on the long put.","when_to_use":"Bearish to a target. Especially good in high-IV names where naked puts are prohibitively expensive.","risk_notes":"Full debit lost if the stock holds above the long strike.","management":"Close at 50-75% of max profit; roll down if the move comes fast and you want to keep the trade on.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Long put delta","type":"delta","default":0.45,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Wing width ($)","type":"number","default":5,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","vertical","defined risk"]},"bull_call_spread":{"id":"bull_call_spread","name":"Bull Call Spread","category":"vertical","outlook":"bullish","complexity":"beginner","summary":"Buy a call, sell a higher one. Cheaper than a long call, with capped upside.","mechanics":"The short call finances part of the long call. Max profit is the width of the strikes minus the debit, reached at or above the short strike; max loss is the debit. Selling the upper strike also cuts your vega, so a vol crush hurts far less than it would on a naked long call.","when_to_use":"Moderately bullish with a defined target. If you can name the price you expect, put the short strike there and stop paying for upside past it.","risk_notes":"Loss is capped at the debit but reached whenever the stock sits below the long strike at expiry.","management":"Take profit near 50-75% of max. Debit spreads realize their value late -- most of the gain arrives in the final two weeks.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Long call delta","type":"delta","default":0.45,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Wing width ($)","type":"number","default":5,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","vertical","defined risk"]},"short_put":{"id":"short_put","name":"Cash-Secured Put","category":"premium-selling","outlook":"bullish","complexity":"beginner","summary":"Sell a put and hold cash to buy the shares. Get paid to set a buy limit.","mechanics":"You collect a credit for the obligation to buy 100 shares at the strike. If the stock stays above it, you keep the credit. If it drops below, you are assigned at the strike -- but your effective basis is the strike minus the credit, which is below where the stock was when you sold.","when_to_use":"You want to own the stock, just lower. Best in elevated IV rank, where the premium is fat relative to the name's own history.","risk_notes":"Risk runs to the strike minus the credit if the stock goes to zero -- substantial, and only acceptable on a name you genuinely want to own at size. This is not 'free money'; it is a levered long position.","management":"The tastytrade convention is 16-30 delta at 45 DTE, managed at 50% of max profit or 21 DTE, whichever comes first. Roll down and out for a credit if tested and you still want the shares.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Short put delta","type":"delta","default":0.25,"min":0.01,"max":0.95,"step":0.01,"help":"0.16 ~ 1 standard deviation, ~84% chance of expiring worthless.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":false,"credit":true,"tags":["credit","short premium","assignment","wheel"]},"covered_call":{"id":"covered_call","name":"Covered Call","category":"income","outlook":"neutral","complexity":"beginner","summary":"Own 100 shares, sell a call against them. Income in exchange for capped upside.","mechanics":"The short call is covered by the shares, so assignment simply sells your stock at the strike. The credit lowers your basis and the position's delta drops from 100 to roughly 100 minus the call's delta.","when_to_use":"You hold shares and expect them to drift or chop. Also the second half of the wheel, after a cash-secured put gets assigned.","risk_notes":"Your downside is nearly identical to holding the stock -- the credit is a thin cushion. The real cost is opportunity: a gap higher leaves the upside on the table above the strike.","management":"Sell 20-30 delta calls 30-45 DTE. If the stock runs, roll up and out for a credit rather than letting the shares go, unless you are happy to be called.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":35,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Short call delta","type":"delta","default":0.3,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"shares","label":"Shares owned","type":"number","default":100,"min":100,"max":100000,"step":100,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":true,"tags":["credit","stock","wheel","income"]},"long_call":{"id":"long_call","name":"Long Call","category":"directional","outlook":"bullish","complexity":"beginner","summary":"Buy a call. Unlimited upside, and the most you can lose is the premium.","mechanics":"You pay a debit for the right to buy 100 shares at the strike. Value comes from two places: intrinsic (how far past the strike the stock is) and extrinsic (time and volatility). Extrinsic decays to zero at expiry, so the stock has to move enough, and fast enough, to outrun theta.","when_to_use":"A directional bullish view with a catalyst and a timeframe. Long calls work best when implied volatility is low relative to its own history -- you are buying vol, so paying up for it stacks the deck against you.","risk_notes":"The full debit is at risk and roughly 70% of long options expire worthless. Being right on direction but late on timing still loses. Long gamma is the compensation: gains accelerate as the move goes your way.","management":"Common practice is to take profits at 50-100% of the debit and cut at 50% of it, and to roll out rather than hold through the last two weeks when theta accelerates hardest.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Target delta","type":"delta","default":0.35,"min":0.01,"max":0.95,"step":0.01,"help":"0.50 is at-the-money. Lower delta = cheaper, lower probability, more leverage.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","long premium","positive gamma"]},"long_put":{"id":"long_put","name":"Long Put","category":"directional","outlook":"bearish","complexity":"beginner","summary":"Buy a put. Profits as the stock falls, with the premium capped as the loss.","mechanics":"The right to sell 100 shares at the strike. Puts carry the skew premium in equities -- downside strikes trade at higher implied vol than equivalent upside strikes -- so you are usually paying a richer vol than a call buyer.","when_to_use":"Bearish view, or portfolio insurance. As a hedge, puts have the advantage over stops that they cannot be gapped through.","risk_notes":"Full debit at risk. Skew makes puts expensive; a put spread often gives a better risk-adjusted expression of the same view.","management":"Same 50% profit-take discipline as long calls. As a hedge, roll quarterly.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Target delta","type":"delta","default":0.35,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","long premium","hedge"]},"protective_put":{"id":"protective_put","name":"Protective Put","category":"hedging","outlook":"bullish","complexity":"beginner","summary":"Own stock, buy a put. Insurance with a known premium.","mechanics":"Caps your loss at the strike minus what you paid, while leaving upside fully intact. Payoff is identical in shape to a long call at the same strike.","when_to_use":"Through earnings or a macro event you do not want to trade around but cannot afford to be wrong on.","risk_notes":"Insurance is a recurring cost. Bought continuously, put protection is a meaningful drag on long-run returns.","management":"Size the protection to the exposure that actually matters, and let it expire if the event passes quietly.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Put delta","type":"delta","default":0.3,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"shares","label":"Shares owned","type":"number","default":100,"min":100,"max":100000,"step":100,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["hedge","stock","insurance"]},"bear_call_spread":{"id":"bear_call_spread","name":"Bear Call Spread (Credit)","category":"vertical","outlook":"bearish","complexity":"intermediate","summary":"Sell a call, buy a higher one. Defined-risk way to fade a rally.","mechanics":"Credit received is max profit; max loss is width minus credit. Because equity call skew is flatter than put skew, call credit spreads usually collect less than the mirror-image put spread at the same delta.","when_to_use":"Bearish or neutral-to-down with elevated IV. Also the upper half of an iron condor.","risk_notes":"Short calls carry assignment risk around ex-dividend dates when they go deep in the money -- watch the extrinsic value on the short leg.","management":"Same 50%-of-credit target and 21 DTE exit as the put side.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Short call delta","type":"delta","default":0.25,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Wing width ($)","type":"number","default":5,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":true,"tags":["credit","vertical","defined risk","theta"]},"broken_wing_butterfly":{"id":"broken_wing_butterfly","name":"Broken Wing Butterfly","category":"advanced","outlook":"bullish","complexity":"advanced","summary":"An asymmetric butterfly, often entered for a credit with risk on only one side.","mechanics":"Widen one wing relative to the other. Done correctly on the put side you enter for a credit, which removes all risk to the upside -- if the stock rallies, you simply keep the credit. All of the risk sits below the far strike.","when_to_use":"Bullish-to-neutral with a strong view that a specific downside level holds.","risk_notes":"The wide wing is where the damage is. Max loss is the difference in wing widths minus the credit -- larger than a symmetric fly.","management":"Take profit at 50% or close if the stock approaches the wide wing.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"near_width","label":"Near wing ($)","type":"number","default":5,"min":0.5,"max":200,"step":0.5,"help":"","options":null},{"key":"far_width","label":"Far wing ($)","type":"number","default":10,"min":0.5,"max":300,"step":0.5,"help":"","options":null},{"key":"delta","label":"Body delta","type":"delta","default":0.3,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":true,"tags":["credit","skip strike","no upside risk"]},"bull_put_spread":{"id":"bull_put_spread","name":"Bull Put Spread (Credit)","category":"vertical","outlook":"bullish","complexity":"intermediate","summary":"Sell a put, buy a lower one. Collect credit; the long put caps the damage.","mechanics":"You keep the full credit if the stock finishes above the short strike. The long put turns an undefined-risk short put into a position whose worst case is the width minus the credit -- a number you know before you enter.","when_to_use":"Bullish or neutral-to-up, in elevated IV rank. The workhorse premium-selling trade on indices and liquid large caps.","risk_notes":"The classic trap: high win rate, poor payoff ratio. A 5-wide spread collecting $1.00 wins ~80% of the time and loses 4x the win when it loses. Position size for the loss, not the win rate.","management":"Enter 30-45 DTE at 16-30 delta short strike, take profit at 50% of the credit, and close by 21 DTE to sidestep gamma risk.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Short put delta","type":"delta","default":0.25,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Wing width ($)","type":"number","default":5,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":true,"tags":["credit","vertical","defined risk","theta"]},"back_ratio_call":{"id":"back_ratio_call","name":"Call Back Ratio (1x2 Long)","category":"volatility","outlook":"volatile","complexity":"advanced","summary":"Sell 1 call, buy 2 higher calls. Unlimited upside, often for near-zero cost.","mechanics":"The inverse of a ratio spread. The short call pays for the two longs; you lose in a narrow band around the long strike but gain without limit above it.","when_to_use":"You expect a violent upside move and want convexity rather than a directional bet.","risk_notes":"Max loss occurs at the long strike at expiry -- precisely where a modest rally would leave you.","management":"Exit before expiry if the big move has not arrived; the trough is deepest at the end.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"short_delta","label":"Short call delta","type":"delta","default":0.45,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Distance to long strikes ($)","type":"number","default":10,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":null,"tags":["long vol","convexity","upside"]},"call_calendar":{"id":"call_calendar","name":"Call Calendar Spread","category":"calendar","outlook":"neutral","complexity":"advanced","summary":"Sell a near-dated call, buy a longer-dated one at the same strike.","mechanics":"You are selling fast theta and buying slow theta at the same strike. The position is long vega and profits when the front month decays while the back month holds value. Its payoff curve is a tent centred on the strike -- and, unlike single-expiry structures, that curve keeps changing shape as the front leg approaches expiry.","when_to_use":"Front-month IV elevated relative to back month (backwardation), around an event that resolves before the front expiration.","risk_notes":"Max loss is the debit, but only if you close both legs together. A large move in either direction collapses the tent. Vega risk is real: a broad vol decline hurts even when the stock cooperates.","management":"Close when the front leg has given up most of its extrinsic, typically with 5-10 days left on it.","params":[{"key":"front_dte","label":"Front (short) DTE","type":"number","default":21,"min":1,"max":365,"step":1,"help":"","options":null},{"key":"back_dte","label":"Back (long) DTE","type":"number","default":49,"min":2,"max":730,"step":1,"help":"","options":null},{"key":"strike_offset","label":"Strike offset from spot ($)","type":"number","default":0,"min":-500,"max":500,"step":0.5,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","long vega","term structure","two expiries"]},"ratio_call_spread":{"id":"ratio_call_spread","name":"Call Ratio Spread (1x2)","category":"advanced","outlook":"neutral","complexity":"advanced","summary":"Buy 1 call, sell 2 higher calls. Often free or a credit, with naked upside risk.","mechanics":"The extra short call finances the long one. Max profit sits at the short strike; above it the extra short call turns the position net short and losses run unbounded.","when_to_use":"You expect a grind up to a level and no further. The payoff peak marks your target.","risk_notes":"Genuinely unlimited upside risk from the uncovered short call. A gap higher is the nightmare scenario.","management":"Close or convert to a butterfly by buying a further-out call if the stock approaches the short strike.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"long_delta","label":"Long call delta","type":"delta","default":0.45,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Distance to short strikes ($)","type":"number","default":10,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":false,"credit":null,"tags":["ratio","undefined risk","credit or even money"]},"collar":{"id":"collar","name":"Collar","category":"hedging","outlook":"neutral","complexity":"intermediate","summary":"Own stock, buy a put, sell a call to pay for it. A hard floor with a ceiling.","mechanics":"The long put sets a floor; the short call finances it and sets a ceiling. Often structured for zero net cost, which is why it is the standard hedge for a concentrated position.","when_to_use":"You hold appreciated stock you cannot or do not want to sell, and you need downside protection through a specific period.","risk_notes":"Upside above the call strike is gone. If the stock rockets, you will wish you had not collared it -- that is the price of the floor.","management":"Roll the collar quarterly; widen the call strike when volatility is high enough to fund it.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":60,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"put_delta","label":"Protective put delta","type":"delta","default":0.25,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"call_delta","label":"Short call delta","type":"delta","default":0.25,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"shares","label":"Shares owned","type":"number","default":100,"min":100,"max":100000,"step":100,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":null,"tags":["hedge","stock","protective"]},"double_diagonal":{"id":"double_diagonal","name":"Double Diagonal","category":"calendar","outlook":"neutral","complexity":"advanced","summary":"Diagonals on both sides. An income structure that is long volatility.","mechanics":"Sell a near-dated strangle, buy a further-dated, wider strangle. Combines a condor's range-bound profit zone with positive vega, so a vol expansion helps rather than hurts.","when_to_use":"Range-bound expectation but a worry that volatility could rise -- the case where a plain iron condor is most fragile.","risk_notes":"Four legs across two expirations means the risk graph shifts every day. Model it repeatedly rather than trusting the entry-day picture.","management":"Close or roll the front legs as they approach expiry.","params":[{"key":"front_dte","label":"Front DTE","type":"number","default":21,"min":1,"max":365,"step":1,"help":"","options":null},{"key":"back_dte","label":"Back DTE","type":"number","default":49,"min":2,"max":730,"step":1,"help":"","options":null},{"key":"delta","label":"Front short delta","type":"delta","default":0.2,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Back-leg extra width ($)","type":"number","default":5,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["long vega","four leg","two expiries"]},"iron_butterfly":{"id":"iron_butterfly","name":"Iron Butterfly","category":"neutral","outlook":"neutral","complexity":"advanced","summary":"Short straddle with wings. Bigger credit than a condor, narrower profit zone.","mechanics":"Sell the at-the-money call and put, buy equidistant wings. Max profit occurs only if the stock pins the middle strike; the credit is large because you sold two ATM extrinsics.","when_to_use":"High IV with a strong conviction the underlying stays pinned -- often around large open-interest strikes near monthly expiration.","risk_notes":"The profit zone is narrow. Realistically you are managing for a partial win, not the pin.","management":"Take 25-40% of max credit. Convert to a condor by rolling a short strike out if the stock trends.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":30,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"width","label":"Wing width ($)","type":"number","default":10,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":true,"tags":["credit","defined risk","pin","four leg"]},"iron_condor":{"id":"iron_condor","name":"Iron Condor","category":"neutral","outlook":"neutral","complexity":"intermediate","summary":"Short strangle with protective wings. Defined-risk income inside a price range.","mechanics":"Four legs: a bull put spread below and a bear call spread above. You keep the credit when the stock finishes between the short strikes. Max loss is the wider wing width minus the credit -- known before you enter, and unaffected by gaps.","when_to_use":"Elevated IV rank on a range-bound underlying, and in accounts where undefined risk is not an option. Indices and large-cap ETFs are the natural home.","risk_notes":"Wing width sets the risk; short-strike delta sets the win rate. A useful sanity check: collect at least a third of the wing width in credit, or the payoff ratio is too poor to survive normal losses.","management":"45 DTE entry, 16 delta shorts, close at 50% of credit or 21 DTE. Roll the untested side in when one wing is threatened.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Short strike delta","type":"delta","default":0.16,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Wing width ($)","type":"number","default":5,"min":0.5,"max":500,"step":0.5,"help":"Distance from each short strike to its protective long.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":true,"tags":["credit","defined risk","theta","four leg"]},"jade_lizard":{"id":"jade_lizard","name":"Jade Lizard","category":"premium-selling","outlook":"neutral","complexity":"advanced","summary":"Short put plus a short call spread, structured so there is no risk to the upside.","mechanics":"Collect a total credit greater than the width of the call spread. Do that and the upside is mathematically risk-free -- if the stock rallies through both call strikes, the credit still exceeds the spread's max loss. All the risk is below.","when_to_use":"Neutral-to-bullish in high IV, on a name you would accept owning at the put strike.","risk_notes":"Undefined downside from the naked short put. The upside-free property only holds if the credit genuinely exceeds the call spread width -- verify it at entry, every time.","management":"Manage at 50% of credit. Defend the put side by rolling down and out.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"put_delta","label":"Short put delta","type":"delta","default":0.25,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"call_delta","label":"Short call delta","type":"delta","default":0.25,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Call spread width ($)","type":"number","default":5,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":false,"credit":true,"tags":["credit","no upside risk","three leg"]},"leaps_call":{"id":"leaps_call","name":"LEAPS Call","category":"leaps","outlook":"bullish","complexity":"intermediate","summary":"A deep in-the-money call a year or more out. Stock exposure for a third of the capital.","mechanics":"At 70-80 delta and 365+ days, the option behaves like leveraged stock: high delta, low gamma, and daily theta so small it is nearly invisible. Extrinsic value is a modest fraction of the premium, and it decays slowly and linearly for most of the holding period.","when_to_use":"Long-term bullish conviction with capital efficiency in mind, or as the long leg of a poor man's covered call.","risk_notes":"You forgo dividends and pay financing embedded in the premium. And a LEAPS still expires -- a thesis that takes three years to work does not fit in a two-year option.","management":"Roll out when roughly 6 months remain, before theta begins to bite. Re-evaluate delta annually.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":450,"min":180,"max":1095,"step":15,"help":"","options":null},{"key":"delta","label":"Target delta","type":"delta","default":0.75,"min":0.01,"max":0.95,"step":0.01,"help":"0.70-0.80 keeps extrinsic low and tracks the stock closely.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","long dated","stock replacement","low theta"]},"call_butterfly":{"id":"call_butterfly","name":"Long Call Butterfly","category":"neutral","outlook":"neutral","complexity":"advanced","summary":"Buy 1 / sell 2 / buy 1 in ascending calls. A cheap bet on a specific price.","mechanics":"A 1-2-1 structure centred on your target price. The debit is small, sometimes a few cents, and max profit is the wing width minus the debit if the stock lands exactly on the body at expiry.","when_to_use":"You have a precise price target and an expiration in mind. Excellent risk-reward when it works; it just rarely works.","risk_notes":"Requires precision in both price and time. Value barely moves until the final week, which tempts people out of a trade that would have paid.","management":"Hold into the last week -- a butterfly's value is almost entirely a final-days phenomenon.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":30,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"center","label":"Body strike ($, 0 = ATM)","type":"number","default":0,"min":0,"max":100000,"step":0.5,"help":"","options":null},{"key":"width","label":"Wing width ($)","type":"number","default":10,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","defined risk","pin","cheap convexity"]},"call_condor":{"id":"call_condor","name":"Long Call Condor","category":"neutral","outlook":"neutral","complexity":"advanced","summary":"All-call condor: a butterfly with a flat top instead of a single peak.","mechanics":"Buy the lowest and highest strikes, sell the two in between. Wider profit zone than a butterfly, smaller max profit.","when_to_use":"Neutral with a range rather than a point target, when the all-call version prices better than the iron condor.","risk_notes":"Four legs of commission and slippage. Check the iron condor equivalent before entering.","management":"Same as the iron condor.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"width","label":"Strike spacing ($)","type":"number","default":5,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","defined risk","four leg"]},"long_guts":{"id":"long_guts","name":"Long Guts","category":"volatility","outlook":"volatile","complexity":"advanced","summary":"Buy an ITM call and an ITM put. A straddle built from in-the-money strikes.","mechanics":"Both legs carry intrinsic value, so the debit is large but the extrinsic at risk is small. Payoff is equivalent to a strangle at the mirrored strikes, sometimes at a better price when the ITM strikes are mispriced.","when_to_use":"When ITM options are quoted cheap relative to their OTM equivalents -- an arbitrage-adjacent play, not a first-choice structure.","risk_notes":"Wide bid-ask spreads on ITM contracts often eat the theoretical advantage. Assignment risk on both legs.","management":"Close early; ITM liquidity gets worse near expiry.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":30,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"offset","label":"ITM depth ($)","type":"number","default":5,"min":0.5,"max":200,"step":0.5,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","long vol","itm"]},"put_butterfly":{"id":"put_butterfly","name":"Long Put Butterfly","category":"neutral","outlook":"neutral","complexity":"advanced","summary":"The put-side mirror of the call butterfly. Same payoff, different skew exposure.","mechanics":"1-2-1 in puts around a target strike. Because put skew is steeper, the same geometry often prices differently than the call version -- worth checking both.","when_to_use":"Precise downside target, or when put-side pricing is friendlier than call-side for the same body.","risk_notes":"Same precision problem as the call butterfly.","management":"Hold into the final week.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":30,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"center","label":"Body strike ($, 0 = ATM)","type":"number","default":0,"min":0,"max":100000,"step":0.5,"help":"","options":null},{"key":"width","label":"Wing width ($)","type":"number","default":10,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","defined risk","pin"]},"long_straddle":{"id":"long_straddle","name":"Long Straddle","category":"volatility","outlook":"volatile","complexity":"intermediate","summary":"Buy the same-strike call and put. Profits from a big move either direction.","mechanics":"Two long options on one strike, so you are long gamma and long vega with a starting delta near zero. You do not need to be right about direction -- only about magnitude. The breakevens sit at the strike plus and minus the total debit.","when_to_use":"Ahead of a binary event when implied volatility has not already priced it in. Compare the straddle's cost to the stock's historical post-event moves; if the straddle is priced above them, the market has already done your work.","risk_notes":"The most common way to lose on a straddle is to be right. Post-event IV crush can drop both legs enough that a move in your favour still nets a loss. Theta is paid twice over.","management":"Close into the event or immediately after -- holding through the vol crush is where the edge evaporates.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":30,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","long vol","long gamma","event"]},"long_strangle":{"id":"long_strangle","name":"Long Strangle","category":"volatility","outlook":"volatile","complexity":"intermediate","summary":"Buy an OTM call and an OTM put. Cheaper than a straddle, needs a bigger move.","mechanics":"Both legs start out of the money, so the debit is smaller but the breakevens are wider. Pure convexity: nearly all extrinsic, so it lives or dies on realized volatility exceeding implied.","when_to_use":"You expect a violent move but do not want to pay the at-the-money price for it.","risk_notes":"Between the strikes at expiry, everything expires worthless. Time decay works against both legs simultaneously.","management":"Take profit on a spike in realized vol; do not hold into the final two weeks.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Wing delta","type":"delta","default":0.2,"min":0.01,"max":0.95,"step":0.01,"help":"Delta of each long option. Lower = cheaper and wider.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","long vol","long gamma"]},"pmcc":{"id":"pmcc","name":"Poor Man's Covered Call (Diagonal)","category":"leaps","outlook":"bullish","complexity":"advanced","summary":"Long LEAPS call as stock substitute, short near-dated call against it.","mechanics":"A long-dated deep ITM call replaces the 100 shares; a 30-45 day OTM call is sold against it. You get most of a covered call's income profile for a fraction of the capital. The critical constraint: the width between strikes plus the credit collected must exceed the LEAPS debit, or a sharp rally can lose money.","when_to_use":"Bullish long-term, want monthly income, do not want to tie up the cost of 100 shares.","risk_notes":"Unlike a real covered call, the short call is not covered by shares -- it is covered by an option that can lose value differently. Early assignment forces you to either exercise the LEAPS or buy shares.","management":"Roll the short call at 50% profit or when it goes in the money. Roll the LEAPS at ~6 months remaining.","params":[{"key":"long_dte","label":"LEAPS DTE","type":"number","default":400,"min":180,"max":1095,"step":15,"help":"","options":null},{"key":"long_delta","label":"LEAPS delta","type":"delta","default":0.8,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"short_dte","label":"Short call DTE","type":"number","default":35,"min":5,"max":120,"step":1,"help":"","options":null},{"key":"short_delta","label":"Short call delta","type":"delta","default":0.25,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["diagonal","income","leaps","capital efficient"]},"put_calendar":{"id":"put_calendar","name":"Put Calendar Spread","category":"calendar","outlook":"neutral","complexity":"advanced","summary":"The put-side calendar. Same tent payoff, positioned below spot.","mechanics":"Sell the near-dated put, buy the far-dated put at the same strike. Useful when you want the tent centred below the current price.","when_to_use":"Neutral-to-slightly-bearish with front-month vol richer than back.","risk_notes":"Early assignment on the short put is a live risk if it goes deep in the money -- monitor its extrinsic value.","management":"Close before the short leg's final week.","params":[{"key":"front_dte","label":"Front (short) DTE","type":"number","default":21,"min":1,"max":365,"step":1,"help":"","options":null},{"key":"back_dte","label":"Back (long) DTE","type":"number","default":49,"min":2,"max":730,"step":1,"help":"","options":null},{"key":"strike_offset","label":"Strike offset from spot ($)","type":"number","default":-5,"min":-500,"max":500,"step":0.5,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":true,"credit":false,"tags":["debit","long vega","term structure"]},"put_ratio_spread":{"id":"put_ratio_spread","name":"Put Ratio Spread (1x2)","category":"advanced","outlook":"neutral","complexity":"advanced","summary":"Buy 1 put, sell 2 lower puts. Harvests put skew, with real downside risk.","mechanics":"Put skew means the two lower-strike puts you sell carry outsized implied vol, so the structure frequently opens for a credit. Max profit at the lower strike; below it you are effectively long stock from that level.","when_to_use":"Mildly bearish or neutral, in a name you would own considerably lower.","risk_notes":"A fast crash is the worst case -- you become long two units of stock into a falling market.","management":"Close at 50% or convert to a butterfly on a sharp move down.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"long_delta","label":"Long put delta","type":"delta","default":0.45,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"width","label":"Distance to short strikes ($)","type":"number","default":10,"min":0.5,"max":500,"step":0.5,"help":"Distance between the strikes, in dollars.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":false,"credit":null,"tags":["ratio","undefined risk","credit or even money","skew"]},"risk_reversal":{"id":"risk_reversal","name":"Risk Reversal","category":"directional","outlook":"bullish","complexity":"advanced","summary":"Sell an OTM put to fund an OTM call. Bullish exposure, often for free.","mechanics":"Because equity put skew is steeper than call skew, the put you sell usually finances the call you buy outright. Delta is strongly positive and the position behaves much like leveraged stock between the strikes.","when_to_use":"Strongly bullish and willing to own the shares at the put strike. Also the cleanest way to express a view that skew is too steep.","risk_notes":"Undefined downside -- identical to a naked short put below the put strike. Only for names you would happily own.","management":"Close the put side at 50% and let the call run, or roll both if the thesis is intact.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":60,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"put_delta","label":"Short put delta","type":"delta","default":0.2,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"call_delta","label":"Long call delta","type":"delta","default":0.25,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":false,"credit":null,"tags":["synthetic","skew","undefined risk"]},"short_straddle":{"id":"short_straddle","name":"Short Straddle","category":"premium-selling","outlook":"neutral","complexity":"advanced","summary":"Sell the same-strike call and put. Maximum premium, maximum risk.","mechanics":"The largest credit available in a two-leg structure, because you sell both at-the-money extrinsics. Delta-neutral at entry, short gamma and short vega thereafter.","when_to_use":"Very high IV rank on a liquid, range-bound underlying, in an account that can absorb the tail.","risk_notes":"Theoretically unlimited to the upside and severe to the downside. A short straddle is short gamma, so losses accelerate exactly when you are already wrong. This belongs only in a properly sized, actively managed book.","management":"Manage at 25% of max profit rather than 50% -- the tail risk is not worth grinding the last quarter out. Defend by rolling the untested side.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":false,"credit":true,"tags":["credit","short vol","undefined risk","theta"]},"short_strangle":{"id":"short_strangle","name":"Short Strangle","category":"premium-selling","outlook":"neutral","complexity":"advanced","summary":"Sell an OTM call and an OTM put. The core undefined-risk premium seller.","mechanics":"Collect two credits and define a profit range between the strikes. At 16 delta per side the structure has roughly a 68% chance of both legs expiring worthless, and the profit zone is far wider than a short straddle's.","when_to_use":"High IV rank, no imminent binary event, liquid underlying with tight spreads.","risk_notes":"Undefined on both sides. Requires margin and genuine discipline about size. One outsized move can erase many months of credits.","management":"16-20 delta per side at 45 DTE, close at 50% of credit or 21 DTE. If one side is tested, roll the untested side toward it to recentre.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":45,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"delta","label":"Short delta per side","type":"delta","default":0.16,"min":0.01,"max":0.95,"step":0.01,"help":"","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":false,"credit":true,"tags":["credit","short vol","undefined risk","theta"]},"synthetic_long":{"id":"synthetic_long","name":"Synthetic Long Stock","category":"directional","outlook":"bullish","complexity":"advanced","summary":"Long ATM call plus short ATM put. Replicates 100 shares almost exactly.","mechanics":"Put-call parity in action: the combination has ~100 deltas, negligible gamma and vega, and near-zero net cost. Any deviation from parity is an arbitrage the market usually closes quickly.","when_to_use":"Capital-efficient stock exposure, or to check whether a chain is fairly priced against the underlying.","risk_notes":"Full downside of stock ownership with margin requirements from the short put, and no dividends.","management":"Roll before expiry to maintain exposure.","params":[{"key":"dte","label":"Days to expiration","type":"number","default":60,"min":0,"max":1095,"step":1,"help":"Calendar days until the option expires.","options":null},{"key":"quantity","label":"Contracts","type":"number","default":1,"min":1,"max":500,"step":1,"help":"Number of spreads/contracts. Scales every leg together.","options":null}],"risk_defined":false,"credit":null,"tags":["synthetic","parity","100 delta"]},"wheel":{"id":"wheel","name":"The Wheel","category":"income","outlook":"bullish","complexity":"intermediate","summary":"Sell cash-secured puts until assigned, then sell covered calls until called away. Repeat.","mechanics":"A cycle, not a single trade. Phase 1: sell a cash-secured put and collect credit. If it expires worthless, sell another. If assigned, you own 100 shares at a basis of strike minus all credits collected. Phase 2: sell covered calls against those shares until they are called away, then return to phase 1.","when_to_use":"Liquid names you are content to own for the long term, with decent IV. The wheel is a way to be paid while waiting -- it is not a way to avoid downside.","risk_notes":"The wheel's reputation for safety is misleading. You are systematically long the underlying with capped upside and full downside; in a sustained decline you accumulate shares into weakness and the call side stops covering the losses. It works on quality names and destroys accounts on falling knives.","management":"30-45 DTE, 20-30 delta both phases. Close at 50% of credit. Never sell a covered call below your cost basis just to collect premium.","params":[
