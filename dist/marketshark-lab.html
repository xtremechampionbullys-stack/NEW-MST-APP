<script>
/* ==========================================================================
   Options engine — a faithful port of services/api/app/engine/*.py
   ==========================================================================
   This is not a mock. The sliders recompute real Black-Scholes prices, greeks,
   payoff curves, breakevens and probabilities in the browser, off the same
   parametric volatility surface the Python synthetic provider uses.

   Verified against the running API before shipping: money figures agree to
   about 0.05%, breakevens to a cent or two. The residual is not sloppiness --
   the server builds its surface by interpolating the chain's *quoted* implied
   volatilities (which are rounded, as real quotes are), while this evaluates
   the underlying model directly. Two defensible paths to the same number.

   What is ported: BSM pricing and greeks, delta->strike inversion, the skewed
   volatility surface including the earnings variance bump, multi-leg payoff,
   breakeven solving, max profit/loss with the correct unbounded rules,
   lognormal probability of profit and expected value, Reg-T capital, and the
   deterministic guidance rules.

   What is NOT ported, deliberately: Bjerksund-Stensland American pricing. The
   API defaults to Black-Scholes for risk graphs anyway (the early-exercise
   premium is sub-penny at and near the money), so this matches the default
   path rather than pretending to more precision than the server uses.
   ========================================================================== */

const DAYS_PER_YEAR = 365;
const SQRT_2PI = Math.sqrt(2 * Math.PI);
const MAD = Math.sqrt(2 / Math.PI);

/* ----------------------------------------------------- normal distribution */

function normCdf(x) {
  // Hart (1968) double-precision cumulative normal, as popularised by West
  // (2005). Accurate to ~1e-15 across the whole range. The common
  // Abramowitz-Stegun polynomial is only ~1e-7, and at that precision the
  // breakevens this page prints drift by a penny against the server -- small,
  // but the kind of small that makes someone doubt the rest of the numbers.
  const xa = Math.abs(x);
  let c;
  if (xa > 37) {
    c = 0;
  } else {
    const e = Math.exp((-xa * xa) / 2);
    if (xa < 7.07106781186547) {
      let b = 3.52624965998911e-2 * xa + 0.700383064443688;
      b = b * xa + 6.37396220353165;
      b = b * xa + 33.912866078383;
      b = b * xa + 112.079291497871;
      b = b * xa + 221.213596169931;
      b = b * xa + 220.206867912376;
      let d = 8.83883476483184e-2 * xa + 1.75566716318264;
      d = d * xa + 16.064177579207;
      d = d * xa + 86.7807322029461;
      d = d * xa + 296.564248779674;
      d = d * xa + 637.333633378831;
      d = d * xa + 793.826512519948;
      d = d * xa + 440.413735824752;
      c = (e * b) / d;
    } else {
      let b = xa + 0.65;
      b = xa + 4 / b;
      b = xa + 3 / b;
      b = xa + 2 / b;
      b = xa + 1 / b;
      c = e / (b * 2.506628274631);
    }
  }
  return x > 0 ? 1 - c : c;
}

const normPdf = (x) => Math.exp(-0.5 * x * x) / SQRT_2PI;

function normPpf(p) {
  if (p <= 0) return -Infinity;
  if (p >= 1) return Infinity;
  const a = [-3.969683028665376e1, 2.209460984245205e2, -2.759285104469687e2,
             1.38357751867269e2, -3.066479806614716e1, 2.506628277459239];
  const b = [-5.447609879822406e1, 1.615858368580409e2, -1.556989798598866e2,
             6.680131188771972e1, -1.328068155288572e1];
  const c = [-7.784894002430293e-3, -3.223964580411365e-1, -2.400758277161838,
             -2.549732539343734, 4.374664141464968, 2.938163982698783];
  const d = [7.784695709041462e-3, 3.224671290700398e-1, 2.445134137142996,
             3.754408661907416];
  const pl = 0.02425;
  let x;
  if (p < pl) {
    const q = Math.sqrt(-2 * Math.log(p));
    x = (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
        ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  } else if (p <= 1 - pl) {
    const q = p - 0.5, r = q * q;
    x = (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q /
        (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  } else {
    const q = Math.sqrt(-2 * Math.log(1 - p));
    x = -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
         ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  return x;
}

/* --------------------------------------------------------- Black-Scholes */

const yearsFromDte = (dte) => Math.max(dte, 0) / DAYS_PER_YEAR;
const intrinsic = (S, K, kind) =>
  kind === 'call' ? Math.max(S - K, 0) : Math.max(K - S, 0);

function bsPrice(S, K, T, r, q, sigma, kind) {
  if (S <= 0 || K <= 0) return 0;
  if (T <= 1e-5 || sigma <= 1e-6) return intrinsic(S, K, kind);
  const v = sigma * Math.sqrt(T);
  const d1 = (Math.log(S / K) + (r - q + 0.5 * sigma * sigma) * T) / v;
  const d2 = d1 - v;
  const dfr = Math.exp(-r * T), dfq = Math.exp(-q * T);
  return kind === 'call'
    ? S * dfq * normCdf(d1) - K * dfr * normCdf(d2)
    : K * dfr * normCdf(-d2) - S * dfq * normCdf(-d1);
}

function bsGreeks(S, K, T, r, q, sigma, kind) {
  if (S <= 0 || K <= 0 || T <= 1e-5 || sigma <= 1e-6) {
    const px = intrinsic(S, K, kind);
    const delta = kind === 'call' ? (S > K ? 1 : 0) : (S < K ? -1 : 0);
    return { price: px, delta, gamma: 0, theta: 0, vega: 0, rho: 0 };
  }
  const sq = Math.sqrt(T), v = sigma * sq;
  const d1 = (Math.log(S / K) + (r - q + 0.5 * sigma * sigma) * T) / v;
  const d2 = d1 - v;
  const dfr = Math.exp(-r * T), dfq = Math.exp(-q * T);
  const pdf = normPdf(d1);
  const price = bsPrice(S, K, T, r, q, sigma, kind);
  const gamma = (dfq * pdf) / (S * sigma * sq);
  const vegaA = S * dfq * pdf * sq;
  let delta, thetaA, rhoA;
  if (kind === 'call') {
    delta = dfq * normCdf(d1);
    thetaA = -(S * dfq * pdf * sigma) / (2 * sq) - r * K * dfr * normCdf(d2)
             + q * S * dfq * normCdf(d1);
    rhoA = K * T * dfr * normCdf(d2);
  } else {
    delta = -dfq * normCdf(-d1);
    thetaA = -(S * dfq * pdf * sigma) / (2 * sq) + r * K * dfr * normCdf(-d2)
             - q * S * dfq * normCdf(-d1);
    rhoA = -K * T * dfr * normCdf(-d2);
  }
  return { price, delta, gamma, theta: thetaA / DAYS_PER_YEAR,
           vega: vegaA / 100, rho: rhoA / 100 };
}

function deltaToStrike(S, T, r, q, sigma, targetDelta, kind) {
  let t = Math.min(Math.max(Math.abs(targetDelta), 1e-4), 1 - 1e-4);
  const dfq = Math.exp(-q * T);
  let nd1 = Math.min(Math.max(t / dfq, 1e-6), 1 - 1e-6);
  const d1 = kind === 'call' ? normPpf(nd1) : -normPpf(nd1);
  const v = sigma * Math.sqrt(T);
  return S * Math.exp(-(d1 * v) + (r - q + 0.5 * sigma * sigma) * T);
}

/* ------------------------------------------------------ volatility surface */

function makeSurface(spot, atmVol, jumpVol, daysToEarnings) {
  const skew = 0.18, smile = 0.55, termSlope = 0.06, floor = 0.03;
  return function iv(strike, dte) {
    if (strike <= 0 || spot <= 0) return atmVol;
    const t = Math.max(dte, 0.5) / 365;
    const anchor = 30 / 365;
    const atm = Math.max(atmVol + termSlope * (Math.sqrt(t) - Math.sqrt(anchor)), floor);
    const k = Math.log(strike / spot);
    const damp = 1 / Math.sqrt(Math.max(t * 12, 0.35));
    let v = Math.max(atm - skew * k * damp + smile * k * k * damp, floor);
    // Variance is additive: an expiry spanning the announcement carries
    // jump_variance / T on top of the diffusive variance. This is what makes
    // the term structure invert into an earnings report.
    if (jumpVol > 0 && daysToEarnings != null && dte > daysToEarnings) {
      v = Math.sqrt(v * v + (jumpVol * jumpVol) / t);
    }
    return v;
  };
}

/* ---------------------------------------------------------------- context */

function makeContext(sym, opts = {}) {
  const s = SYMBOLS[sym];
  const rate = 0.045;
  const daysToEarnings = s.nextEarnings
    ? Math.round((new Date(s.nextEarnings + 'T00:00:00') - startOfToday()) / 86400000)
    : null;
  const surface = makeSurface(s.spot, s.atmVol, s.jumpVol, daysToEarnings);
  const inc = s.inc;

  const roundStrike = (k) => Math.round(k / inc) * inc;

  return {
    symbol: sym, spot: s.spot, rate, q: 0, inc, surface, daysToEarnings,
    roundStrike,
    atmStrike: () => roundStrike(s.spot),
    ivFor: (strike, dte) => surface(strike, dte),
    theo(kind, strike, dte) {
      return bsPrice(s.spot, strike, yearsFromDte(dte), rate, 0,
                     surface(strike, dte), kind);
    },
    strikeForDelta(delta, dte, kind) {
      const T = yearsFromDte(dte);
      let k = s.spot;
      for (let i = 0; i < 4; i++) {
        k = deltaToStrike(s.spot, T, rate, 0, surface(k, dte), delta, kind);
      }
      return roundStrike(k);
    },
    optionLeg(kind, strike, dte, qty) {
      const k = roundStrike(strike);
      return { kind, quantity: qty, strike: k, dte,
               iv: surface(k, dte), multiplier: 100,
               entryPrice: Math.max(this.quoteMid(kind, k, dte), 0.01) };
    },

    // The API fills from the chain's quoted mid, not the raw model price, and
    // real chains quote in cents. Replicating the synthetic provider's spread
    // and rounding here keeps this page on the same pricing path the server
    // uses rather than a slightly cleaner one.
    quoteMid(kind, strike, dte) {
      const theo = this.theo(kind, strike, dte);
      const moneyness = Math.abs(Math.log(strike / s.spot));
      const rel = 0.012 + moneyness * 0.42 + (dte < 7 ? 0.02 : 0);
      const half = Math.max(0.01, theo * rel * 0.5, 0.005);
      const bid = Math.max(Math.round((theo - half) * 100) / 100, 0);
      let ask = Math.round((theo + half) * 100) / 100;
      if (ask <= bid) ask = Math.round((bid + 0.01) * 100) / 100;
      return (bid + ask) / 2;
    },
    stockLeg(qty) {
      return { kind: 'stock', quantity: qty, strike: null, dte: 0, iv: 0,
               multiplier: 1, entryPrice: s.spot };
    },
  };
}

function startOfToday() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

/* ----------------------------------------------------------- leg valuation */

function legValueAt(leg, spot, daysElapsed, rate, q, ivShift = 0) {
  if (leg.kind === 'stock') return spot;
  const remaining = leg.dte - daysElapsed;
  if (remaining <= 0) return intrinsic(spot, leg.strike, leg.kind);
  const sigma = Math.max(leg.iv + ivShift, 1e-4);
  return bsPrice(spot, leg.strike, yearsFromDte(remaining), rate, q, sigma, leg.kind);
}

function legValueAtExpiry(leg, spot) {
  return leg.kind === 'stock' ? spot : intrinsic(spot, leg.strike, leg.kind);
}

/* -------------------------------------------------------------- position */

const COMMISSION = 0.65;

function makePosition(legs, ctx, name) {
  const commission = legs
    .filter((l) => l.kind !== 'stock')
    .reduce((a, l) => a + Math.abs(l.quantity) * COMMISSION, 0);
  const gross = legs.reduce((a, l) => a + l.quantity * l.entryPrice * l.multiplier, 0);
  const optDtes = legs.filter((l) => l.kind !== 'stock').map((l) => l.dte);

  const pos = {
    legs, name, ctx,
    spot: ctx.spot, rate: ctx.rate, q: ctx.q,
    commission,
    netDebit: gross + commission,
    get netCredit() { return -this.netDebit; },
    contracts: legs.filter((l) => l.kind !== 'stock')
      .reduce((a, l) => a + Math.abs(l.quantity), 0),
    minDte: optDtes.length ? Math.min(...optDtes) : 0,
    maxDte: optDtes.length ? Math.max(...optDtes) : 0,
    get isMultiExpiry() { return new Set(optDtes).size > 1; },
    get blendedIv() {
      const opts = legs.filter((l) => l.kind !== 'stock');
      if (!opts.length) return 0;
      const w = opts.reduce((a, l) => a + Math.abs(l.quantity), 0) || 1;
      return opts.reduce((a, l) => a + l.iv * Math.abs(l.quantity), 0) / w;
    },
  };

  pos.plAt = (spot, days = 0, ivShift = 0) =>
    legs.reduce(
      (a, l) => a + l.quantity * legValueAt(l, spot, days, pos.rate, pos.q, ivShift) * l.multiplier,
      0,
    ) - pos.netDebit;

  // Multi-expiry positions are drawn at the NEAR expiry with longer legs marked
  // to model. Valuing a calendar's back month at intrinsic would be nonsense.
  pos.plAtExpiry = (spot) =>
    pos.isMultiExpiry
      ? pos.plAt(spot, pos.minDte)
      : legs.reduce((a, l) => a + l.quantity * legValueAtExpiry(l, spot) * l.multiplier, 0)
        - pos.netDebit;

  pos.priceGrid = (points = 161, widthSigma = 3) => {
    const iv = pos.blendedIv || 0.3;
    const t = yearsFromDte(pos.maxDte || 30);
    const move = pos.spot * iv * Math.sqrt(Math.max(t, 1 / 365)) * widthSigma;
    let lo = pos.spot - move, hi = pos.spot + move;
    const strikes = legs.filter((l) => l.strike).map((l) => l.strike);
    if (strikes.length) {
      const pad = (Math.max(...strikes) - Math.min(...strikes)) * 0.35 + pos.spot * 0.05;
      lo = Math.min(lo, Math.min(...strikes) - pad);
      hi = Math.max(hi, Math.max(...strikes) + pad);
    }
    lo = Math.max(lo, 0.01);
    hi = Math.max(hi, lo * 1.02);
    const step = (hi - lo) / (points - 1);
    return Array.from({ length: points }, (_, i) => lo + i * step);
  };

  pos.netGreeks = (spot = pos.spot, days = 0) => {
    const tot = { delta: 0, gamma: 0, theta: 0, vega: 0, rho: 0 };
    for (const l of legs) {
      const scale = l.quantity * l.multiplier;
      if (l.kind === 'stock') { tot.delta += scale; continue; }
      const rem = Math.max(l.dte - days, 0);
      const g = bsGreeks(spot, l.strike, yearsFromDte(rem), pos.rate, pos.q, l.iv, l.kind);
      tot.delta += g.delta * scale;
      tot.gamma += g.gamma * scale;
      tot.theta += g.theta * scale;
      tot.vega += g.vega * scale;
      tot.rho += g.rho * scale;
    }
    tot.dollarDelta = tot.delta * spot;
    return tot;
  };

  pos.legRows = () => legs.map((l) => {
    if (l.kind === 'stock') {
      return { label: `${l.quantity > 0 ? 'Long' : 'Short'} ${Math.abs(l.quantity)} shares`,
               kind: 'stock', quantity: l.quantity, iv: null,
               entryPrice: l.entryPrice, theo: pos.spot,
               delta: l.quantity, theta: 0, vega: 0 };
    }
    const g = bsGreeks(pos.spot, l.strike, yearsFromDte(l.dte), pos.rate, pos.q, l.iv, l.kind);
    const scale = l.quantity * l.multiplier;
    return {
      label: `${l.quantity > 0 ? 'Long' : 'Short'} ${Math.abs(l.quantity)}x ${fmtStrike(l.strike)} ` +
             `${l.kind === 'call' ? 'Call' : 'Put'} ${l.dte}DTE`,
      kind: l.kind, quantity: l.quantity, iv: l.iv, entryPrice: l.entryPrice,
      theo: g.price, delta: g.delta * scale, theta: g.theta * scale, vega: g.vega * scale,
    };
  });

  pos.isRiskDefined = (() => {
    const sum = (k, sign) => legs
      .filter((l) => l.kind === k && (sign > 0 ? l.quantity > 0 : l.quantity < 0))
      .reduce((a, l) => a + Math.abs(l.quantity), 0);
    const shares = legs.filter((l) => l.kind === 'stock')
      .reduce((a, l) => a + l.quantity, 0);
    const callCover = sum('call', 1) + Math.max(shares, 0) / 100;
    return sum('call', -1) <= callCover + 1e-9 && sum('put', -1) <= sum('put', 1) + 1e-9;
  })();

  return pos;
}

/* ------------------------------------------------------------- breakevens */

function breakevens(pos) {
  const px = pos.priceGrid(4000, 5);
  const vals = px.map((p) => pos.plAtExpiry(p));
  const roots = [];
  for (let i = 0; i < px.length - 1; i++) {
    if (vals[i] === 0) { roots.push(px[i]); continue; }
    if (vals[i] * vals[i + 1] < 0) {
      let lo = px[i], hi = px[i + 1];
      for (let k = 0; k < 40; k++) {
        const mid = 0.5 * (lo + hi);
        if ((pos.plAtExpiry(lo) < 0) !== (pos.plAtExpiry(mid) < 0)) hi = mid;
        else lo = mid;
      }
      roots.push(0.5 * (lo + hi));
    }
  }
  const out = [];
  for (const r of roots.sort((a, b) => a - b)) {
    if (!out.length || Math.abs(r - out[out.length - 1]) > Math.max(0.01, pos.spot * 1e-4)) {
      out.push(Math.round(r * 100) / 100);
    }
  }
  return out;
}

function maxProfitLoss(pos) {
  // Only the UPSIDE can be genuinely unbounded: a share price cannot go below
  // zero, so a cash-secured put's worst case is strike minus credit, not
  // "unlimited".
  const px = pos.priceGrid(1200, 6);
  const vals = px.map((p) => pos.plAtExpiry(p));
  vals.push(pos.plAtExpiry(1e-4));
  let maxProfit = Math.max(...vals);
  let maxLoss = Math.min(...vals);

  const a = pos.spot * 8, b = pos.spot * 12;
  const slope = (pos.plAtExpiry(b) - pos.plAtExpiry(a)) / (b - a);
  if (slope > 1e-6) maxProfit = Infinity;
  else if (slope < -1e-6) maxLoss = -Infinity;
  return [maxProfit, maxLoss];
}

/* ------------------------------------------------------------- analytics */

function analyze(pos) {
  const sigma = pos.blendedIv || 0.3;
  const T = Math.max(yearsFromDte(pos.minDte || 30), 1e-9);
  const drift = pos.rate - pos.q;
  const mu = Math.log(pos.spot) + (drift - 0.5 * sigma * sigma) * T;
  const sd = sigma * Math.sqrt(T);
  const cdf = (s) => (s <= 0 ? 0 : normCdf((Math.log(s) - mu) / sd));
  const pdf = (s) => (s <= 0 ? 0 : Math.exp(-0.5 * ((Math.log(s) - mu) / sd) ** 2)
                                     / (s * sd * SQRT_2PI));
  const quantile = (p) => Math.exp(mu + sd * normPpf(p));

  // POP: integrate the lognormal density over the profitable regions, refining
  // each sign change. Handles the many-zone cases (butterflies, ratios) that a
  // breakeven-only formula gets wrong.
  const nodes = 900;
  const lo = Math.max(quantile(0.00005), 0.01), hi = quantile(0.99995);
  const step = (hi - lo) / nodes;
  let total = 0, prevS = lo, prevProfit = pos.plAtExpiry(lo) > 0, prevCdf = cdf(lo);
  for (let i = 1; i <= nodes; i++) {
    const s = lo + i * step;
    const profit = pos.plAtExpiry(s) > 0;
    if (profit !== prevProfit) {
      let a = prevS, b = s;
      for (let k = 0; k < 30; k++) {
        const mid = 0.5 * (a + b);
        if ((pos.plAtExpiry(mid) > 0) === prevProfit) a = mid; else b = mid;
      }
      const crossCdf = cdf(0.5 * (a + b));
      if (prevProfit) total += crossCdf - prevCdf;
      prevCdf = crossCdf;
      prevProfit = profit;
    }
    prevS = s;
  }
  if (prevProfit) total += cdf(hi) - prevCdf;
  const pop = Math.max(0, Math.min(1, total));

  // Expected value by Simpson integration against the same density.
  let ev = 0, mass = 0;
  const n2 = 600, h = (hi - lo) / n2;
  for (let i = 0; i <= n2; i++) {
    const s = lo + i * h;
    const w = i === 0 || i === n2 ? 1 : i % 2 ? 4 : 2;
    const dens = pdf(s);
    ev += w * pos.plAtExpiry(s) * dens;
    mass += w * dens;
  }
  ev *= h / 3; mass *= h / 3;
  if (mass > 1e-9) ev /= mass;

  const [maxProfit, maxLoss] = maxProfitLoss(pos);
  const bes = breakevens(pos);
  const defined = pos.isRiskDefined;

  let capital;
  if (defined && Number.isFinite(maxLoss)) {
    capital = Math.abs(maxLoss);
  } else {
    capital = 0;
    for (const l of pos.legs) {
      if (l.kind === 'stock' || l.quantity >= 0) continue;
      const k = l.strike;
      const otm = l.kind === 'put' ? Math.max(pos.spot - k, 0) : Math.max(k - pos.spot, 0);
      capital += Math.max(0.2 * pos.spot - otm, 0.1 * (l.kind === 'put' ? k : pos.spot))
                 * Math.abs(l.quantity) * l.multiplier;
    }
    capital = Math.max(capital - Math.max(-pos.netDebit, 0), capital * 0.5);
  }
  capital += pos.legs.filter((l) => l.kind === 'stock')
    .reduce((a, l) => a + Math.abs(l.quantity) * pos.spot * 0.5, 0);

  const move = pos.spot * sigma * Math.sqrt(T);
  const risk = Number.isFinite(maxLoss) ? Math.abs(maxLoss) : null;
  const reward = Number.isFinite(maxProfit) ? maxProfit : null;

  const pot = {};
  for (const l of pos.legs) {
    if (l.kind === 'stock' || l.quantity >= 0) continue;
    const level = l.strike;
    const muJ = drift - 0.5 * sigma * sigma;
    const aa = Math.log(level / pos.spot);
    if (Math.abs(aa) < 1e-12) { pot[`${fmtStrike(level)}${l.kind[0].toUpperCase()}`] = 1; continue; }
    const t1 = aa > 0 ? normCdf((-Math.abs(aa) + muJ * T) / sd)
                      : normCdf((-Math.abs(aa) - muJ * T) / sd);
    const expo = Math.max(Math.min((2 * muJ * aa) / (sigma * sigma), 700), -700);
    const t2 = aa > 0 ? Math.exp(expo) * normCdf((-aa - muJ * T) / sd)
                      : Math.exp(expo) * normCdf((aa + muJ * T) / sd);
    pot[`${fmtStrike(level)}${l.kind[0].toUpperCase()}`] = Math.max(0, Math.min(1, t1 + t2));
  }

  return {
    spot: pos.spot,
    netDebit: pos.netDebit,
    isCredit: pos.netDebit < 0,
    commission: pos.commission,
    contracts: pos.contracts,
    maxProfit: Number.isFinite(maxProfit) ? maxProfit : null,
    maxLoss: Number.isFinite(maxLoss) ? maxLoss : null,
    maxProfitUnbounded: !Number.isFinite(maxProfit),
    maxLossUnbounded: !Number.isFinite(maxLoss),
    riskDefined: defined,
    breakevens: bes,
    pop, expectedValue: ev,
    riskReward: risk && reward != null && risk > 1e-9 ? reward / risk : null,
    returnOnCapital: reward != null && capital > 1e-9 ? reward / capital : null,
    capital,
    expectedMove: { low: pos.spot - move, high: pos.spot + move },
    expectedMovePct: move / pos.spot,
    blendedIv: sigma,
    dte: pos.minDte,
    netGreeks: pos.netGreeks(),
    probabilityOfTouch: pot,
    volSensitivity: [-0.1, -0.05, 0, 0.05, 0.1].map((shift) => ({
      shift, pl: pos.plAt(pos.spot, 0, shift),
      deltaPl: pos.plAt(pos.spot, 0, shift) - pos.plAt(pos.spot, 0, 0),
    })),
  };
}

/* -------------------------------------------------------- guidance rules */

function evaluateInsights(pos, a, earningsCtx) {
  const out = [];
  const g = a.netGreeks;

  if (a.maxLossUnbounded) {
    out.push({ severity: 'critical', title: 'Unlimited loss to the upside',
      detail: 'This position contains an uncovered short call. There is no cap on what a gap higher can cost. Size it as though the worst case will happen, or buy a further-out call to define the risk.' });
  } else if (!a.riskDefined) {
    out.push({ severity: 'warning', title: 'Undefined risk',
      detail: `A naked short option means the worst case is bounded only by the stock going to zero — about ${money(Math.abs(a.maxLoss))} here. That is a real number, not a theoretical one, and it is why this structure needs margin and active management.` });
  }

  if (a.maxProfit != null && a.maxLoss != null && a.maxLoss < 0) {
    const ratio = a.maxProfit / Math.abs(a.maxLoss);
    const bePop = ratio > 0 ? 1 / (1 + ratio) : 1;
    const edge = a.pop - bePop;
    if (edge < -0.02) {
      out.push({ severity: 'warning', title: 'Win rate does not cover the payoff ratio',
        detail: `You win ${money(a.maxProfit)} and lose ${money(Math.abs(a.maxLoss))}, so you need to be right ${pctS(bePop, 0)} of the time just to break even. The model puts this trade at ${pctS(a.pop, 0)}. The high win rate is real — it just is not high enough.` });
    } else if (edge > 0.05) {
      out.push({ severity: 'info', title: 'Payoff ratio and win rate line up',
        detail: `Break-even win rate is ${pctS(bePop, 0)} and the model puts this at ${pctS(a.pop, 0)}, so the structure has room for a normal run of losses.` });
    }
  }

  if (a.expectedValue < 0) {
    out.push({ severity: 'caution', title: 'Negative expected value at these prices',
      detail: `Integrating the payoff against the market's own implied distribution gives ${money(a.expectedValue)}. That is what you should expect: options are close to fairly priced, so a positive number here usually means your volatility assumption differs from the market's — make sure that is deliberate.` });
  } else if (a.capital > 0 && a.expectedValue / a.capital > 0.02) {
    out.push({ severity: 'info', title: 'Positive modelled expectancy',
      detail: `Expected value of ${money(a.expectedValue)} on ${money(a.capital)} of capital. This rests on the volatility input being right.` });
  }

  if (g.theta < 0 && a.dte && a.dte < 21) {
    out.push({ severity: 'caution', title: 'Long premium inside the gamma zone',
      detail: `With ${Math.round(a.dte)} days left, decay accelerates sharply and the position is paying ${money(Math.abs(g.theta), 2)} a day. Long options in the final three weeks need the move to happen quickly.` });
  }
  if (g.theta > 0 && a.dte && a.dte < 21) {
    out.push({ severity: 'caution', title: 'Short premium inside the gamma zone',
      detail: 'Under 21 days, short options gain the fastest but their delta also swings hardest against you. The standard discipline is to close or roll at 21 DTE rather than harvest the last of the credit.' });
  }

  for (const [label, p] of Object.entries(a.probabilityOfTouch)) {
    if (p > 0.55) {
      out.push({ severity: 'caution', title: `Short strike ${label} likely to be tested`,
        detail: `There is a ${pctS(p, 0)} chance the underlying trades through this strike at some point before expiry — roughly double the chance of finishing beyond it. Have the adjustment planned now.` });
    }
  }

  if (a.isCredit && a.riskDefined && a.maxProfit && a.maxLoss) {
    const capture = a.maxProfit / (a.maxProfit + Math.abs(a.maxLoss));
    if (capture < 0.2) {
      out.push({ severity: 'warning', title: 'Thin credit for the width',
        detail: `You are collecting ${pctS(capture, 0)} of the spread width. Below about a third, one loss undoes several wins and commissions start to matter. Consider a narrower spread or a closer short strike.` });
    }
  }

  if (a.maxProfit && a.commission > Math.abs(a.maxProfit) * 0.1) {
    out.push({ severity: 'caution', title: 'Commissions are a large share of max profit',
      detail: `${money(a.commission, 2)} of commission against ${money(a.maxProfit)} of maximum profit. Multi-leg structures at small size are disproportionately expensive to trade.` });
  }

  if (earningsCtx && earningsCtx.inWindow) {
    const detail = `${earningsCtx.symbol} reports on ${earningsCtx.date} (${earningsCtx.daysAway} days away), before this position expires. The chain is pricing a ${pctS(earningsCtx.impliedMove, 1)} move, roughly ${(pos.spot * (1 - earningsCtx.impliedMove)).toFixed(2)} to ${(pos.spot * (1 + earningsCtx.impliedMove)).toFixed(2)}.`;
    if (g.vega < -1) {
      out.push({ severity: 'warning', title: 'Short premium through an earnings report',
        detail: detail + ' You are short volatility into a scheduled binary event. The implied volatility collapse afterwards is what you are being paid for — and the gap risk is what you are being paid to take. Either size it as an event trade or choose an expiry that closes before the announcement.' });
    } else if (g.vega > 1) {
      out.push({ severity: 'caution', title: 'Long premium through an earnings report',
        detail: detail + ' Implied volatility is elevated ahead of the event and typically collapses immediately after, so the stock can move your way and the position can still lose.' });
    } else {
      out.push({ severity: 'caution', title: 'Earnings falls inside this expiry',
        detail: detail + ' Check that the position is sized for a gap, not just for the day-to-day range.' });
    }
  }

  const order = { critical: 0, warning: 1, caution: 2, info: 3 };
  return out.sort((x, y) => order[x.severity] - order[y.severity]);
}

/* ==========================================================================
   Strategy builders — ports of the `build` lambdas in engine/strategies.py.
   Metadata (names, params, mechanics, risk copy) comes from the API bundle, so
   only the leg construction lives here.
   ========================================================================== */

const BUILDERS = {
  long_call: (c, p) => [c.optionLeg('call', c.strikeForDelta(p.delta, p.dte, 'call'), p.dte, 1)],
  long_put: (c, p) => [c.optionLeg('put', c.strikeForDelta(p.delta, p.dte, 'put'), p.dte, 1)],
  short_put: (c, p) => [c.optionLeg('put', c.strikeForDelta(p.delta, p.dte, 'put'), p.dte, -1)],

  covered_call: (c, p) => [
    c.stockLeg(p.shares),
    c.optionLeg('call', c.strikeForDelta(p.delta, p.dte, 'call'), p.dte,
                -Math.max(1, Math.floor(p.shares / 100))),
  ],

  bull_call_spread: (c, p) => {
    const k = c.strikeForDelta(p.delta, p.dte, 'call');
    return [c.optionLeg('call', k, p.dte, 1), c.optionLeg('call', k + p.width, p.dte, -1)];
  },
  bull_put_spread: (c, p) => {
    const k = c.strikeForDelta(p.delta, p.dte, 'put');
    return [c.optionLeg('put', k, p.dte, -1), c.optionLeg('put', k - p.width, p.dte, 1)];
  },
  bear_call_spread: (c, p) => {
    const k = c.strikeForDelta(p.delta, p.dte, 'call');
    return [c.optionLeg('call', k, p.dte, -1), c.optionLeg('call', k + p.width, p.dte, 1)];
  },

  long_straddle: (c, p) => [
    c.optionLeg('call', c.atmStrike(), p.dte, 1),
    c.optionLeg('put', c.atmStrike(), p.dte, 1),
  ],
  short_straddle: (c, p) => [
    c.optionLeg('call', c.atmStrike(), p.dte, -1),
    c.optionLeg('put', c.atmStrike(), p.dte, -1),
  ],
  long_strangle: (c, p) => [
    c.optionLeg('call', c.strikeForDelta(p.delta, p.dte, 'call'), p.dte, 1),
    c.optionLeg('put', c.strikeForDelta(p.delta, p.dte, 'put'), p.dte, 1),
  ],
  short_strangle: (c, p) => [
    c.optionLeg('call', c.strikeForDelta(p.delta, p.dte, 'call'), p.dte, -1),
    c.optionLeg('put', c.strikeForDelta(p.delta, p.dte, 'put'), p.dte, -1),
  ],

  iron_condor: (c, p) => {
    const kp = c.strikeForDelta(p.delta, p.dte, 'put');
    const kc = c.strikeForDelta(p.delta, p.dte, 'call');
    return [
      c.optionLeg('put', kp - p.width, p.dte, 1),
      c.optionLeg('put', kp, p.dte, -1),
      c.optionLeg('call', kc, p.dte, -1),
      c.optionLeg('call', kc + p.width, p.dte, 1),
    ];
  },
  iron_butterfly: (c, p) => {
    const k = c.atmStrike();
    return [
      c.optionLeg('put', k - p.width, p.dte, 1),
      c.optionLeg('put', k, p.dte, -1),
      c.optionLeg('call', k, p.dte, -1),
      c.optionLeg('call', k + p.width, p.dte, 1),
    ];
  },
  call_butterfly: (c, p) => {
    const k = p.center ? c.roundStrike(p.center) : c.atmStrike();
    return [
      c.optionLeg('call', k - p.width, p.dte, 1),
      c.optionLeg('call', k, p.dte, -2),
      c.optionLeg('call', k + p.width, p.dte, 1),
    ];
  },
  broken_wing_butterfly: (c, p) => {
    const k = c.strikeForDelta(p.delta, p.dte, 'put');
    return [
      c.optionLeg('put', k + p.near_width, p.dte, 1),
      c.optionLeg('put', k, p.dte, -2),
      c.optionLeg('put', k - p.far_width, p.dte, 1),
    ];
  },

  call_calendar: (c, p) => {
    const k = c.roundStrike(c.spot + (p.strike_offset || 0));
    return [
      c.optionLeg('call', k, p.front_dte, -1),
      c.optionLeg('call', k, p.back_dte, 1),
    ];
  },

  leaps_call: (c, p) => [
    c.optionLeg('call', c.strikeForDelta(p.delta, p.dte, 'call'), p.dte, 1),
  ],
  pmcc: (c, p) => [
    c.optionLeg('call', c.strikeForDelta(p.long_delta, p.long_dte, 'call'), p.long_dte, 1),
    c.optionLeg('call', c.strikeForDelta(p.short_delta, p.short_dte, 'call'), p.short_dte, -1),
  ],

  collar: (c, p) => {
    const n = Math.max(1, Math.floor(p.shares / 100));
    return [
      c.stockLeg(p.shares),
      c.optionLeg('put', c.strikeForDelta(p.put_delta, p.dte, 'put'), p.dte, n),
      c.optionLeg('call', c.strikeForDelta(p.call_delta, p.dte, 'call'), p.dte, -n),
    ];
  },

  jade_lizard: (c, p) => {
    const kc = c.strikeForDelta(p.call_delta, p.dte, 'call');
    return [
      c.optionLeg('put', c.strikeForDelta(p.put_delta, p.dte, 'put'), p.dte, -1),
      c.optionLeg('call', kc, p.dte, -1),
      c.optionLeg('call', kc + p.width, p.dte, 1),
    ];
  },

  ratio_call_spread: (c, p) => {
    const k = c.strikeForDelta(p.long_delta, p.dte, 'call');
    return [
      c.optionLeg('call', k, p.dte, 1),
      c.optionLeg('call', k + p.width, p.dte, -2),
    ];
  },

  wheel: (c, p) =>
    (p.phase || 'put') === 'put'
      ? [c.optionLeg('put', c.strikeForDelta(p.delta, p.dte, 'put'), p.dte, -1)]
      : [c.stockLeg(100),
         c.optionLeg('call', c.strikeForDelta(p.delta, p.dte, 'call'), p.dte, -1)],
};

function buildPosition(templateId, ctx, params) {
  const meta = DATA.templates[templateId];
  const merged = {};
  for (const p of meta.params) merged[p.key] = p.default;
  Object.assign(merged, params || {});

  const build = BUILDERS[templateId];
  if (!build) return null;

  let legs = build(ctx, merged);
  const qty = Number(merged.quantity || 1);
  if (qty !== 1) legs = legs.map((l) => ({ ...l, quantity: l.quantity * qty }));

  return makePosition(legs, ctx, meta.name);
}

const SYMBOLS = DATA.symbols;
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};

/* ------------------------------------------------------------ formatting */

function money(v, dp = 0) {
  if (v == null || !Number.isFinite(v)) return '—';
  const s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  return (v < 0 ? '-$' : '$') + s;
}
const pctS = (v, dp = 1) => (v == null || !Number.isFinite(v) ? '—' : (v * 100).toFixed(dp) + '%');
const numS = (v, dp = 2) => (v == null || !Number.isFinite(v) ? '—' : v.toFixed(dp));
const fmtStrike = (k) => (k % 1 === 0 ? String(k) : k.toFixed(1));

function ticks(lo, hi, target = 6) {
  if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi <= lo) return [lo];
  const raw = (hi - lo) / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm >= 5 ? 5 : norm >= 2 ? 2 : 1) * mag;
  const out = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + step * 1e-9; t += step) {
    out.push(Math.abs(t) < step * 1e-9 ? 0 : t);
  }
  return out;
}

const svgEl = (t, attrs = {}) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', t);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};

/* ------------------------------------------------------- earnings context */

function earningsContext(pos) {
  const s = SYMBOLS[state.symbol];
  if (!s.nextEarnings) return null;
  const days = Math.round(
    (new Date(s.nextEarnings + 'T00:00:00') - startOfToday()) / 86400000,
  );
  const inWindow = days >= 0 && days <= pos.maxDte;
  // Event move isolated from the term structure, exactly as the API does it:
  // sigma_jump is a one-off return sd, and E|move| = sqrt(2/pi) * sigma_jump.
  return {
    symbol: state.symbol, date: s.nextEarnings, daysAway: days, inWindow,
    impliedMove: MAD * s.jumpVol, eventVol: s.jumpVol, session: s.session,
  };
}

    tile(a.isCredit ? 'Net credit' : 'Net debit', money(Math.abs(a.netDebit)),
         `${a.contracts} option legs · ${money(a.commission, 2)} fees`) +

         a.riskReward ? `${numS(a.riskReward)}:1 reward/risk` : 'no capped reward',
         a.maxProfitUnbounded || (a.maxProfit ?? 0) > 0 ? 'pos' : '') +
    tile('Max loss', a.maxLossUnbounded ? 'Unlimited' : money(a.maxLoss),
         a.riskDefined ? 'risk defined' : 'undefined risk', 'neg') +
    tile('Prob. of profit', pctS(a.pop, 1), 'market-implied') +
    tile('Expected value', (a.expectedValue >= 0 ? '+' : '') + money(a.expectedValue),
         'against the implied distribution', a.expectedValue >= 0 ? 'pos' : 'neg') +
    tile('Breakeven' + (a.breakevens.length === 1 ? '' : 's'),
         a.breakevens.length ? a.breakevens.map((b) => b.toFixed(2)).join(' / ') : '—',
         `spot ${a.spot.toFixed(2)}`) +
    tile('Capital', money(a.capital),
         a.returnOnCapital ? `${pctS(a.returnOnCapital, 1)} max return` : 'Reg-T estimate') +
    tile('Expected move',
         `${a.expectedMove.low.toFixed(1)} – ${a.expectedMove.high.toFixed(1)}`,
         `±${pctS(a.expectedMovePct, 1)} · ${Math.round(a.dte)} DTE · IV ${pctS(a.blendedIv, 1)}`);
  // Breakevens can be long; shrink that one tile's value text.
  const bTile = t.children[5];
  if (a.breakevens.length > 1) bTile.querySelector('.v').style.fontSize = '15px';
  t.children[7].querySelector('.v').style.fontSize = '15px';
  return t;
}

/* ------------------------------------------------------------ payoff chart */

const CURVE_RAMP = ['var(--seq-250)', 'var(--seq-350)', 'var(--seq-450)', 'var(--seq-550)'];

function payoffChart(pos, a) {
  const W = 900, H = 420, PAD = { top: 18, right: 74, bottom: 34, left: 62 };
  const prices = pos.priceGrid(161);
  const expiry = prices.map((p) => pos.plAtExpiry(p));

  const dte = pos.minDte || 30;
  const offsets = [0, +(dte / 3).toFixed(1), +((2 * dte) / 3).toFixed(1)];
  const curves = offsets.map((d) => ({
    label: d === 0 ? 'Today (T+0)' : `T+${d}`,
    pl: prices.map((p) => pos.plAt(p, d)),
  }));

  const all = [...expiry, ...curves.flatMap((c) => c.pl)];
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = Math.max((hi - lo) * 0.12, 1);
  lo = Math.min(lo - pad, 0); hi = Math.max(hi + pad, 0);

  const xMin = prices[0], xMax = prices[prices.length - 1];
  const iw = W - PAD.left - PAD.right, ih = H - PAD.top - PAD.bottom;
  const sx = (p) => PAD.left + ((p - xMin) / (xMax - xMin)) * iw;
  const sy = (v) => PAD.top + (1 - (v - lo) / (hi - lo)) * ih;
  const path = (vals) => vals.map((v, i) => `${i ? 'L' : 'M'}${sx(prices[i]).toFixed(1)},${sy(v).toFixed(1)}`).join(' ');

  const wrap = el('div', 'chart-wrap');

  const legend = el('div', 'legend');
  legend.innerHTML =
    `<span class="item"><span class="line" style="background:var(--series-2)"></span>At expiration</span>` +
    curves.map((c, i) =>
      `<span class="item"><span class="line" style="background:${CURVE_RAMP[i]}"></span>${c.label}</span>`).join('') +
    `<span class="item muted"><span class="line" style="background:var(--status-good);opacity:.55"></span>profit` +
    `<span class="line" style="background:var(--status-critical);opacity:.55;margin-left:8px"></span>loss</span>`;
  wrap.appendChild(legend);

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': `Profit and loss versus ${state.symbol} price at expiration` });

  for (const t of ticks(lo, hi, 6)) {
    svg.appendChild(svgEl('line', { class: 'grid-line', x1: PAD.left, x2: W - PAD.right, y1: sy(t), y2: sy(t) }));
    const tx = svgEl('text', { class: 'axis-label', x: PAD.left - 8, y: sy(t) + 3.5, 'text-anchor': 'end' });
    tx.textContent = money(t);
    svg.appendChild(tx);
  }

  // Polarity shading: split the expiry curve at each sign change.
  const zeroY = sy(0);
  let run = [];
  const flush = () => {
    if (run.length > 1) {
      const d = `M${sx(prices[run[0].i]).toFixed(1)},${zeroY.toFixed(1)} ` +
        run.map((r) => `L${sx(prices[r.i]).toFixed(1)},${sy(expiry[r.i]).toFixed(1)}`).join(' ') +
        ` L${sx(prices[run[run.length - 1].i]).toFixed(1)},${zeroY.toFixed(1)} Z`;
      svg.appendChild(svgEl('path', { d,
        fill: run[0].sign > 0 ? 'var(--status-good)' : 'var(--status-critical)', opacity: 0.14 }));
    }
    run = [];
  };
  for (let i = 0; i < expiry.length; i++) {
    const sign = expiry[i] >= 0 ? 1 : -1;
    if (run.length && run[run.length - 1].sign !== sign) flush();
    run.push({ i, sign });
  }
  flush();

  svg.appendChild(svgEl('line', { x1: PAD.left, x2: W - PAD.right, y1: zeroY, y2: zeroY,
    stroke: 'var(--axis)', 'stroke-width': 1.5 }));

  for (const l of pos.legs) {
    if (!l.strike || l.strike < xMin || l.strike > xMax) continue;
    svg.appendChild(svgEl('line', { x1: sx(l.strike), x2: sx(l.strike),
      y1: H - PAD.bottom, y2: H - PAD.bottom - 7, stroke: 'var(--text-muted)', 'stroke-width': 1.5 }));
  }

  if (pos.spot >= xMin && pos.spot <= xMax) {
    svg.appendChild(svgEl('line', { x1: sx(pos.spot), x2: sx(pos.spot), y1: PAD.top,
      y2: H - PAD.bottom, stroke: 'var(--text-muted)', 'stroke-width': 1, opacity: 0.7 }));
    const t = svgEl('text', { class: 'axis-label', x: sx(pos.spot) + 5, y: PAD.top + 10 });
    t.textContent = `spot ${pos.spot.toFixed(2)}`;
    svg.appendChild(t);
  }

  curves.forEach((c, i) => svg.appendChild(svgEl('path', { d: path(c.pl), fill: 'none',
    stroke: CURVE_RAMP[i], 'stroke-width': 2, 'stroke-linejoin': 'round' })));
  svg.appendChild(svgEl('path', { d: path(expiry), fill: 'none', stroke: 'var(--series-2)',
    'stroke-width': 2, 'stroke-linejoin': 'round' }));

  for (const b of a.breakevens) {
    if (b < xMin || b > xMax) continue;
    svg.appendChild(svgEl('circle', { cx: sx(b), cy: zeroY, r: 4.5, fill: 'var(--series-2)',
      stroke: 'var(--surface-1)', 'stroke-width': 2 }));
    const t = svgEl('text', { class: 'axis-label', x: sx(b), y: zeroY - 9,
      'text-anchor': 'middle', fill: 'var(--text-secondary)' });
    t.textContent = b.toFixed(2);
    svg.appendChild(t);
  }

  const lbl = (txt, y, fill) => {
    const t = svgEl('text', { class: 'axis-label', x: W - PAD.right + 6, y: y + 3.5, fill });
    t.textContent = txt;
    svg.appendChild(t);
  };
  lbl('expiry', sy(expiry[expiry.length - 1]), 'var(--series-2)');
  lbl('today', sy(curves[0].pl[curves[0].pl.length - 1]), CURVE_RAMP[0]);

  svg.appendChild(svgEl('line', { class: 'axis-line', x1: PAD.left, x2: W - PAD.right,
    y1: H - PAD.bottom, y2: H - PAD.bottom }));
  for (const t of ticks(xMin, xMax, 7)) {
    const tx = svgEl('text', { class: 'axis-label', x: sx(t), y: H - PAD.bottom + 15, 'text-anchor': 'middle' });
    tx.textContent = t.toFixed(t < 20 ? 1 : 0);
    svg.appendChild(tx);
  }
  const ax = svgEl('text', { class: 'axis-label', x: (PAD.left + W - PAD.right) / 2, y: H - 3, 'text-anchor': 'middle' });
  ax.textContent = `${state.symbol} price at expiration`;
  svg.appendChild(ax);

  // Crosshair + tooltip
  const cross = svgEl('g', { 'pointer-events': 'none', style: 'display:none' });
  const cl = svgEl('line', { stroke: 'var(--text-secondary)', 'stroke-width': 1, y1: PAD.top, y2: H - PAD.bottom });
  const dot = svgEl('circle', { r: 4, fill: 'var(--series-2)', stroke: 'var(--surface-1)', 'stroke-width': 2 });
  cross.append(cl, dot);
  svg.appendChild(cross);

  const tip = el('div', 'tooltip');
  tip.style.display = 'none';
  wrap.append(svg, tip);

  svg.addEventListener('mousemove', (e) => {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    if (px < PAD.left || px > W - PAD.right) return;
    const value = xMin + ((px - PAD.left) / iw) * (xMax - xMin);
    let i = 0, best = Infinity;
    prices.forEach((p, j) => { const d = Math.abs(p - value); if (d < best) { best = d; i = j; } });
    cross.style.display = '';
    cl.setAttribute('x1', sx(prices[i])); cl.setAttribute('x2', sx(prices[i]));
    dot.setAttribute('cx', sx(prices[i])); dot.setAttribute('cy', sy(expiry[i]));
    tip.style.display = '';
    const leftPct = ((e.clientX - r.left) / r.width) * 100;
    tip.style.left = leftPct > 62 ? `${leftPct - 20}%` : `${leftPct + 3}%`;
    tip.style.transform = leftPct > 62 ? 'translateX(-100%)' : '';
    tip.style.top = '10px';
    tip.innerHTML =
      `<div class="tt-head">${prices[i].toFixed(2)}</div>` +
      `<div class="tt-row"><span>At expiration</span><strong class="${expiry[i] >= 0 ? 'pos' : 'neg'}">${money(expiry[i])}</strong></div>` +
      curves.map((c) => `<div class="tt-row"><span>${c.label}</span><span class="${c.pl[i] >= 0 ? 'pos' : 'neg'}">${money(c.pl[i])}</span></div>`).join('') +
      `<div class="tt-row" style="margin-top:4px;opacity:.75"><span>vs spot</span><span>${(((prices[i] - pos.spot) / pos.spot) * 100).toFixed(1)}%</span></div>`;
  });
  svg.addEventListener('mouseleave', () => { cross.style.display = 'none'; tip.style.display = 'none'; });

  return wrap;
}

/* ------------------------------------------------------------- P/L surface */

function plSurface(pos) {
  const prices = pos.priceGrid(41);
  const horizon = pos.minDte || 30;
  const days = Array.from({ length: 21 }, (_, i) => +((i * horizon) / 20).toFixed(1));
  const grid = days.map((d) => prices.map((p) => pos.plAt(p, d)));
  const flat = grid.flat();
  const maxPos = Math.max(...flat, 1e-9), maxNeg = Math.min(...flat, -1e-9);

  const NEG = ['var(--div-neg-1)', 'var(--div-neg-2)', 'var(--div-neg-3)'];
  const POS = ['var(--div-pos-1)', 'var(--div-pos-2)', 'var(--div-pos-3)'];
  const color = (v) => {
    if (Math.abs(v) < Math.max(maxPos, -maxNeg) * 0.02) return 'var(--div-mid)';
    const t = v > 0 ? Math.min(v / maxPos, 1) : Math.min(v / maxNeg, 1);
    const ramp = v > 0 ? POS : NEG;
    return ramp[t > 0.66 ? 2 : t > 0.33 ? 1 : 0];
  };

  const wrap = el('div', 'chart-wrap');
  const legend = el('div', 'legend');
  legend.innerHTML =
    '<span class="item muted">Loss</span>' +
    [...NEG].reverse().map((c) => `<span class="line" style="background:${c};width:18px;height:10px;border-radius:2px"></span>`).join('') +
    '<span class="line" style="background:var(--div-mid);width:18px;height:10px;border-radius:2px"></span>' +
    POS.map((c) => `<span class="line" style="background:${c};width:18px;height:10px;border-radius:2px"></span>`).join('') +
    '<span class="item muted">Profit</span>' +
    `<span class="item muted" style="margin-left:auto">rows: days held · columns: ${state.symbol} price</span>`;
  wrap.appendChild(legend);

  const holder = el('div');
  holder.style.cssText = 'padding:4px 14px 14px;overflow-x:auto';
  const tbl = el('table', 'num');
  tbl.style.cssText = 'border-collapse:separate;border-spacing:2px;font-size:10px';
  const colStep = Math.max(1, Math.ceil(prices.length / 9));
  const thead = el('thead');
  const hr = el('tr');
  hr.appendChild(el('th', null, 'day')).style.cssText =
    'padding:0 6px 0 0;text-align:right;color:var(--text-muted);font-weight:500;font-size:9.5px';
  prices.forEach((p, c) => {
    const th = el('th', null, c % colStep === 0 ? p.toFixed(0) : '');
    th.style.cssText = 'padding:0;font-weight:500;color:var(--text-muted);font-size:9.5px;min-width:22px';
    hr.appendChild(th);
  });
  thead.appendChild(hr); tbl.appendChild(thead);

  const tip = el('div', 'tooltip');
  tip.style.display = 'none';
  const tbody = el('tbody');
  const rowStep = Math.max(1, Math.ceil(days.length / 8));
  grid.forEach((row, r) => {
    const tr = el('tr');
    const lab = el('td', null, r % rowStep === 0 ? days[r].toFixed(0) : '');
    lab.style.cssText = 'padding:0 6px 0 0;text-align:right;color:var(--text-muted);font-size:9.5px';
    tr.appendChild(lab);
    row.forEach((v, c) => {
      const td = el('td');
      td.style.cssText = `background:${color(v)};width:22px;height:15px;border-radius:2px;padding:0;cursor:crosshair`;
      td.onmouseenter = () => {
        tip.style.display = '';
        tip.style.right = '18px'; tip.style.top = '34px';
        tip.innerHTML = `<div class="tt-head">${prices[c].toFixed(2)}</div>` +
          `<div class="tt-row"><span>Day</span><span>${days[r].toFixed(0)}</span></div>` +
          `<div class="tt-row"><span>P/L</span><strong class="${v >= 0 ? 'pos' : 'neg'}">${money(v)}</strong></div>`;
      };
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  holder.appendChild(tbl);
  wrap.append(holder, tip);
  wrap.onmouseleave = () => { tip.style.display = 'none'; };
  return wrap;
}

/* -------------------------------------------------------------- chain grid */

function chainGrid(ctx, pos) {
  const dte = Math.round(pos.minDte || 45);
  const strikes = [];
  const lo = ctx.roundStrike(ctx.spot * 0.88), hi = ctx.roundStrike(ctx.spot * 1.12);
  for (let k = lo; k <= hi + 1e-9; k += ctx.inc) strikes.push(+k.toFixed(4));

  const wrap = el('div');
  wrap.appendChild(el('div', 'row',
    `<span class="chip">${dte} DTE</span><span class="tiny muted">theoretical mid, priced off the same surface the risk graph uses</span>`)
  ).style.cssText = 'padding:10px 14px;gap:12px';

  const scroll = el('div', 'scroll');
  const t = el('table', 'table');
  t.innerHTML =
    '<thead><tr><th colspan="3" style="text-align:center;color:var(--text-secondary)">Calls</th>' +
    '<th style="text-align:center">Strike</th>' +
    '<th colspan="3" style="text-align:center;color:var(--text-secondary)">Puts</th></tr>' +
    '<tr><th>IV</th><th>Δ</th><th>Mid</th><th></th><th>Mid</th><th>Δ</th><th>IV</th></tr></thead>';
  const tb = el('tbody');
  const T = yearsFromDte(dte);
  const used = new Set(pos.legs.filter((l) => l.strike).map((l) => l.strike));

  for (const k of strikes) {
    const ivc = ctx.ivFor(k, dte), ivp = ctx.ivFor(k, dte);
    const gc = bsGreeks(ctx.spot, k, T, ctx.rate, 0, ivc, 'call');
    const gp = bsGreeks(ctx.spot, k, T, ctx.rate, 0, ivp, 'put');
    const atm = Math.abs(k - ctx.spot) < ctx.inc / 2;
    const inUse = used.has(k);
    const tint = 'color-mix(in oklab, var(--series-1) 8%, transparent)';
    const tr = el('tr');
    if (inUse) tr.style.background = 'color-mix(in oklab, var(--series-2) 12%, transparent)';
    tr.innerHTML =
      `<td style="background:${k < ctx.spot ? tint : 'none'}">${pctS(ivc, 1)}</td>` +
      `<td style="background:${k < ctx.spot ? tint : 'none'}">${numS(gc.delta)}</td>` +
      `<td style="background:${k < ctx.spot ? tint : 'none'}">${numS(gc.price)}</td>` +
      `<td style="text-align:center;font-weight:${atm ? 650 : 500};background:${atm ? 'var(--surface-3)' : 'var(--surface-2)'}">${fmtStrike(k)}</td>` +
      `<td style="background:${k > ctx.spot ? tint : 'none'}">${numS(gp.price)}</td>` +
      `<td style="background:${k > ctx.spot ? tint : 'none'}">${numS(gp.delta)}</td>` +
      `<td style="background:${k > ctx.spot ? tint : 'none'}">${pctS(ivp, 1)}</td>`;
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  scroll.appendChild(t);
  wrap.appendChild(scroll);
  return wrap;
}

const GREEK_HELP = {

};

function volSensTable(a) {

/* ==========================================================================
   Research view: forecast, forward test, dojo.

   Unlike the Strategy Lab, nothing here is recomputed in the browser. These
   are snapshots produced by the Python engine at build time.

   That is a deliberate line, not a shortcut. The Lab's pricing math is a few
   hundred lines that can be verified against Python to the cent, and the build
   does verify it. HAR-RV, GARCH, walk-forward validation and a path-dependent
   Monte Carlo are thousands of lines of numerics; a second implementation of
   those would drift from the first, and a reader would have no way to tell
   which of the two was wrong. A snapshot cannot drift, because it is not a
   second implementation -- it is the answer the real engine gave.
   ========================================================================== */

const RESEARCH_SYMBOLS = Object.keys(DATA.research || {});

function researchTile(k, v, n, cls = '') {
  return `<div class="tile"><div class="k">${k}</div>` +
    `<div class="v ${cls}">${v}</div><div class="n">${n}</div></div>`;
}

function kvRow(label, value, cls = '') {
  return `<div class="kv"><span>${label}</span><strong class="${cls}">${value}</strong></div>`;
}

/* --------------------------------------------------------------- forecast */

function volTermChart(projections, impliedNow) {
  const W = 900, H = 230, P = { t: 16, r: 20, b: 28, l: 60 };
  const xs = projections.map((p) => p.days);
  const all = projections.flatMap((p) => [p.projected_vol, p.diffusive_vol])
    .concat(impliedNow != null ? [impliedNow] : []);
  const lo = Math.min(...all) * 0.9, hi = Math.max(...all) * 1.08;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const x = (d) => P.l + ((d - xs[0]) / (xs[xs.length - 1] - xs[0] || 1)) * iw;
  const y = (v) => P.t + ih - ((v - lo) / (hi - lo || 1)) * ih;

  const wrap = el('div', 'chart-wrap');
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': 'Projected volatility by horizon, split into diffusive and event components' });

  for (const t of ticks(lo, hi, 5)) {
    svg.appendChild(svgEl('line', { class: 'grid-line', x1: P.l, x2: W - P.r, y1: y(t), y2: y(t) }));
    const lab = svgEl('text', { class: 'axis-label', x: P.l - 8, y: y(t) + 3, 'text-anchor': 'end' });
    lab.textContent = (t * 100).toFixed(0) + '%';
    svg.appendChild(lab);
  }

  // The shaded gap between the two lines IS the earnings contribution. A gap
  // reads more directly than a stacked segment when the question is "how much
  // of this projection is the announcement".
  const up = projections.map((p, i) => `${i ? 'L' : 'M'}${x(p.days)},${y(p.projected_vol)}`).join(' ');
  const down = projections.map((p) => `L${x(p.days)},${y(p.diffusive_vol)}`).reverse().join(' ');
  svg.appendChild(svgEl('path', { d: `${up} ${down} Z`, fill: 'var(--series-2)', opacity: 0.16 }));

  if (impliedNow != null) {
    svg.appendChild(svgEl('line', { x1: P.l, x2: W - P.r, y1: y(impliedNow), y2: y(impliedNow),
      stroke: 'var(--series-4)', 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
    const t = svgEl('text', { class: 'axis-label', x: W - P.r - 2, y: y(impliedNow) - 5,
      'text-anchor': 'end', fill: 'var(--series-4)' });
    t.textContent = `implied now ${(impliedNow * 100).toFixed(0)}%`;
    svg.appendChild(t);
  }

  svg.appendChild(svgEl('path', { d: up, fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2 }));
  svg.appendChild(svgEl('path', {
    d: projections.map((p, i) => `${i ? 'L' : 'M'}${x(p.days)},${y(p.diffusive_vol)}`).join(' '),
    fill: 'none', stroke: 'var(--series-3)', 'stroke-width': 2, 'stroke-dasharray': '6 3' }));

  for (const p of projections) {
    svg.appendChild(svgEl('circle', { cx: x(p.days), cy: y(p.projected_vol), r: 3, fill: 'var(--series-1)' }));
    const lab = svgEl('text', { class: 'axis-label', x: x(p.days), y: H - P.b + 16, 'text-anchor': 'middle' });
    lab.textContent = p.days + 'd';
    svg.appendChild(lab);
  }
  svg.appendChild(svgEl('line', { class: 'axis-line', x1: P.l, x2: W - P.r, y1: H - P.b, y2: H - P.b }));

  wrap.appendChild(svg);
  const leg = el('div', 'legend');
  leg.innerHTML =
    '<span class="item"><span class="line" style="background:var(--series-1)"></span> projected total</span>' +
    '<span class="item"><span class="line" style="background:var(--series-3)"></span> diffusive only</span>' +
    '<span class="item muted">shaded gap: earnings contribution</span>';
  wrap.appendChild(leg);
  return wrap;
}

function skillBar(os) {
  const lo = Math.min(0.35, os.accuracy - 0.05, os.base_rate - 0.05);
  const hi = Math.max(0.65, os.accuracy + 0.05, os.base_rate + 0.05);
  const place = (v) => `${((v - lo) / (hi - lo)) * 100}%`;
  const wrap = el('div', 'skill');
  wrap.innerHTML =
    `<div class="skill-track">` +
    `<div class="skill-fill" style="width:${place(os.accuracy)}"></div>` +
    `<div class="skill-band" style="left:${place(os.base_rate - 2 * os.standard_error)};` +
    `width:${((4 * os.standard_error) / (hi - lo)) * 100}%"></div>` +
    `<div class="skill-mark" style="left:${place(os.base_rate)}"></div>` +
    `</div>` +
    `<div class="skill-legend">` +
    `<span><span class="swatch" style="background:var(--series-1)"></span>` +
    `out-of-sample accuracy <strong>${pctS(os.accuracy)}</strong></span>` +
    `<span><span class="swatch" style="background:var(--text-secondary)"></span>` +
    `base rate <strong>${pctS(os.base_rate)}</strong></span>` +
    `<span class="muted">shaded: ±2 standard errors around the base rate</span>` +
    `</div>`;
  return wrap;
}

function fanChart(days, bands) {
  const W = 900, H = 260, P = { t: 16, r: 20, b: 28, l: 60 };
  const all = Object.values(bands).flat();
  const lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.06 || 1;
  const yLo = lo - pad, yHi = hi + pad;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const x = (d) => P.l + ((d - days[0]) / (days[days.length - 1] - days[0] || 1)) * iw;
  const y = (v) => P.t + ih - ((v - yLo) / (yHi - yLo || 1)) * ih;

  const wrap = el('div', 'chart-wrap');
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': 'Simulated price paths as percentile bands' });
  for (const t of ticks(yLo, yHi, 5)) {
    svg.appendChild(svgEl('line', { class: 'grid-line', x1: P.l, x2: W - P.r, y1: y(t), y2: y(t) }));
    const lab = svgEl('text', { class: 'axis-label', x: P.l - 8, y: y(t) + 3, 'text-anchor': 'end' });
    lab.textContent = t.toFixed(0);
    svg.appendChild(lab);
  }
  const area = (lower, upper) =>
    upper.map((v, i) => `${i ? 'L' : 'M'}${x(days[i])},${y(v)}`).join(' ') + ' ' +
    lower.map((v, i) => `L${x(days[i])},${y(v)}`).reverse().join(' ') + ' Z';

  // Sequential ramp, not categorical slots: these bands are an ordered
  // quantity and an ordered colour scale says so.
  svg.appendChild(svgEl('path', { d: area(bands['5'], bands['95']), fill: 'var(--seq-600)', opacity: 0.30 }));
  svg.appendChild(svgEl('path', { d: area(bands['25'], bands['75']), fill: 'var(--seq-450)', opacity: 0.45 }));
  svg.appendChild(svgEl('path', {
    d: bands['50'].map((v, i) => `${i ? 'L' : 'M'}${x(days[i])},${y(v)}`).join(' '),
    fill: 'none', stroke: 'var(--seq-250)', 'stroke-width': 2 }));

  svg.appendChild(svgEl('line', { class: 'axis-line', x1: P.l, x2: W - P.r, y1: H - P.b, y2: H - P.b }));
  const step = Math.max(1, Math.floor(days.length / 6));
  days.forEach((d, i) => {
    if (i % step) return;
    const lab = svgEl('text', { class: 'axis-label', x: x(d), y: H - P.b + 16, 'text-anchor': 'middle' });
    lab.textContent = d + 'd';
    svg.appendChild(lab);
  });
  wrap.appendChild(svg);
  const leg = el('div', 'legend');
  leg.innerHTML =
    '<span class="item"><span class="line" style="background:var(--seq-250)"></span> median</span>' +
    '<span class="item"><span class="swatch" style="background:var(--seq-450)"></span> 25–75th</span>' +
    '<span class="item"><span class="swatch" style="background:var(--seq-600)"></span> 5–95th</span>';
  wrap.appendChild(leg);
  return wrap;
}

function outcomeRibbon(pd) {
  const segs = [
    ['Profit target', pd.hit_profit_target, 'var(--status-good)'],
    ['Stop loss', pd.hit_stop_loss, 'var(--status-critical)'],
    ['Held to exit', pd.closed_on_time, 'var(--seq-450)'],
  ];
  const wrap = el('div', 'card-body');
  wrap.innerHTML =
    `<div class="ribbon" role="img" aria-label="${segs.map(([k, v]) => `${k} ${pctS(v)}`).join(', ')}">` +
    segs.map(([k, v, c]) => `<div style="width:${v * 100}%;background:${c}" title="${k}"></div>`).join('') +
    '</div><div class="legend" style="padding:10px 0 0">' +
    segs.map(([k, v, c]) =>
      `<span class="item"><span class="swatch" style="background:${c}"></span>${k} <strong>${pctS(v)}</strong></span>`
    ).join('') + '</div>';
  return wrap;
}

  page.appendChild(el('div', 'card', `<div class="card-body tiny muted">${f.note}</div>`));

function sparkline(values, up, width = 104, height = 26) {
  if (!values || values.length < 2) return el('div');
  const lo = Math.min(...values), hi = Math.max(...values);
  const span = hi - lo || 1;
  const step = width / (values.length - 1);
  const svg = svgEl('svg', { width, height, viewBox: `0 0 ${width} ${height}` });
  const d = values.map((v, i) =>
    `${i ? 'L' : 'M'}${(i * step).toFixed(1)},${(height - ((v - lo) / span) * height).toFixed(1)}`).join(' ');
  svg.appendChild(svgEl('path', { d, fill: 'none',
    stroke: up ? 'var(--status-good)' : 'var(--status-critical)',
    'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
  return svg;
}

      '<th style="width:118px">60 sessions</th></tr></thead><tbody>' +
      seg.rows.map((r) =>
        '<tr><td><span class="inst">' +
        `<span class="inst-label">${r.label}</span>` +
        `<span class="inst-sym">${r.symbol}` +
        // The proxy marker goes on the row, not in a footnote: an ETF standing
        // in for a futures contract is most wrong out of hours, which is
        // exactly when a futures board gets opened.
        (r.is_proxy
          ? `<span class="proxy-tag" title="No futures feed is configured, so this row quotes ${r.symbol} in place of ${r.proxy_for}.">≈ ${r.proxy_for}</span>`
          : '') +
        '</span></span></td>' +
        `<td>${r.last != null ? numS(r.last) : '—'}</td>` +
        moveCell(r.change_1d) + moveCell(r.change_1w) + moveCell(r.change_1m) +
        moveCell(r.change_3m) + moveCell(r.rs_1m_vs_benchmark) +
        `<td>${r.realized_vol_20d != null ? pctS(r.realized_vol_20d, 0) : '—'}</td>` +
        `<td class="${(r.pct_from_52w_high ?? 0) < -0.1 ? 'neg' : ''}">` +
        `${r.pct_from_52w_high != null ? pctS(r.pct_from_52w_high, 1) : '—'}</td>` +
        '<td class="spark"></td></tr>').join('') +
      '</tbody></table>';
    body.appendChild(t);

    // Sparklines are SVG nodes, so they are attached after the row HTML rather
    // than serialised into it.
    t.querySelectorAll('td.spark').forEach((cell, i) => {
      cell.style.textAlign = 'right';
      cell.appendChild(sparkline(seg.rows[i].sparkline));
    });
  }
  card.appendChild(body);
  card.appendChild(el('div', 'card-body tiny muted', b.provenance));
  return card;
}

const BW = 900, BPAD = { top: 14, right: 62, bottom: 26, left: 66 };

function equityCurve(points, height = 240) {
  const values = points.map((p) => p.e);
  let lo = Math.min(...values, 0), hi = Math.max(...values, 0);
  const pad = Math.max((hi - lo) * 0.1, 1);
  lo -= pad; hi += pad;
  const iw = BW - BPAD.left - BPAD.right, ih = height - BPAD.top - BPAD.bottom;
  const sx = (i) => BPAD.left + (i / (points.length - 1)) * iw;
  const sy = (v) => BPAD.top + (1 - (v - lo) / (hi - lo)) * ih;

  const wrap = el('div', 'chart-wrap');
  const svg = svgEl('svg', { viewBox: `0 0 ${BW} ${height}`, role: 'img',
    'aria-label': 'Backtest equity curve' });

  for (const t of ticks(lo, hi, 5)) {
    svg.appendChild(svgEl('line', { class: 'grid-line', x1: BPAD.left, x2: BW - BPAD.right, y1: sy(t), y2: sy(t) }));
    const tx = svgEl('text', { class: 'axis-label', x: BPAD.left - 8, y: sy(t) + 3.5, 'text-anchor': 'end' });
    tx.textContent = money(t);
    svg.appendChild(tx);
  }

  const line = points.map((p, i) => `${i ? 'L' : 'M'}${sx(i).toFixed(1)},${sy(p.e).toFixed(1)}`).join(' ');
  svg.appendChild(svgEl('path', {
    d: `${line} L${sx(points.length - 1).toFixed(1)},${sy(0).toFixed(1)} L${sx(0).toFixed(1)},${sy(0).toFixed(1)} Z`,
    fill: 'var(--series-1)', opacity: 0.12 }));
  svg.appendChild(svgEl('line', { x1: BPAD.left, x2: BW - BPAD.right, y1: sy(0), y2: sy(0),
    stroke: 'var(--axis)', 'stroke-width': 1.5 }));
  svg.appendChild(svgEl('path', { d: line, fill: 'none', stroke: 'var(--series-1)',
    'stroke-width': 2, 'stroke-linejoin': 'round' }));

  svg.appendChild(svgEl('line', { class: 'axis-line', x1: BPAD.left, x2: BW - BPAD.right,
    y1: height - BPAD.bottom, y2: height - BPAD.bottom }));
  const every = Math.max(1, Math.floor(points.length / 6));
  points.forEach((p, i) => {
    if (i % every) return;
    const tx = svgEl('text', { class: 'axis-label', x: sx(i), y: height - BPAD.bottom + 15, 'text-anchor': 'middle' });
    tx.textContent = p.d.slice(2, 7);
    svg.appendChild(tx);
  });

  const cross = svgEl('g', { 'pointer-events': 'none', style: 'display:none' });
  const cl = svgEl('line', { stroke: 'var(--text-secondary)', 'stroke-width': 1, y1: BPAD.top, y2: height - BPAD.bottom });
  const dot = svgEl('circle', { r: 4, fill: 'var(--series-1)', stroke: 'var(--surface-1)', 'stroke-width': 2 });
  cross.append(cl, dot);
  svg.appendChild(cross);

  const tip = el('div', 'tooltip');
  tip.style.display = 'none';
  wrap.append(svg, tip);

  svg.addEventListener('mousemove', (e) => {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * BW;
    const i = Math.round(((px - BPAD.left) / iw) * (points.length - 1));
    if (i < 0 || i >= points.length) return;
    const p = points[i];
    cross.style.display = '';
    cl.setAttribute('x1', sx(i)); cl.setAttribute('x2', sx(i));
    dot.setAttribute('cx', sx(i)); dot.setAttribute('cy', sy(p.e));
    tip.style.display = '';
    tip.style.top = '8px';
    if (i > points.length / 2) { tip.style.left = '16px'; tip.style.right = ''; }
    else { tip.style.right = '74px'; tip.style.left = ''; }
    tip.innerHTML = `<div class="tt-head">${p.d}</div>` +
      `<div class="tt-row"><span>Equity</span><strong class="${p.e >= 0 ? 'pos' : 'neg'}">${money(p.e)}</strong></div>` +
      `<div class="tt-row"><span>Realized</span><span>${money(p.r)}</span></div>` +
      `<div class="tt-row"><span>Open</span><span>${money(p.u)}</span></div>` +
      `<div class="tt-row"><span>Underlying</span><span>${p.s.toFixed(2)}</span></div>` +
      `<div class="tt-row"><span>Positions</span><span>${p.n}</span></div>`;
  });
  svg.addEventListener('mouseleave', () => { cross.style.display = 'none'; tip.style.display = 'none'; });
  return wrap;
}

function drawdownChart(points, height = 110) {
  let peak = 0;
  const series = points.map((p) => { peak = Math.max(peak, p.e); return p.e - peak; });
  const lo = Math.min(...series, -1);
  const iw = BW - BPAD.left - BPAD.right, ih = height - BPAD.top - 16;
  const sx = (i) => BPAD.left + (i / (series.length - 1)) * iw;
  const sy = (v) => BPAD.top + (v / lo) * ih;

  const wrap = el('div', 'chart-wrap');
  const svg = svgEl('svg', { viewBox: `0 0 ${BW} ${height}`, role: 'img',
    'aria-label': 'Drawdown from peak equity' });
  svg.appendChild(svgEl('line', { class: 'grid-line', x1: BPAD.left, x2: BW - BPAD.right, y1: sy(lo), y2: sy(lo) }));
  for (const [v, y] of [[lo, sy(lo)], [0, BPAD.top]]) {
    const t = svgEl('text', { class: 'axis-label', x: BPAD.left - 8, y: y + 3.5, 'text-anchor': 'end' });
    t.textContent = money(v);
    svg.appendChild(t);
  }
  const line = series.map((v, i) => `${i ? 'L' : 'M'}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(' ');
  svg.appendChild(svgEl('path', {
    d: `${line} L${sx(series.length - 1).toFixed(1)},${BPAD.top} L${sx(0).toFixed(1)},${BPAD.top} Z`,
    fill: 'var(--status-critical)', opacity: 0.28 }));
  svg.appendChild(svgEl('path', { d: line, fill: 'none', stroke: 'var(--status-critical)', 'stroke-width': 1.5 }));
  svg.appendChild(svgEl('line', { x1: BPAD.left, x2: BW - BPAD.right, y1: BPAD.top, y2: BPAD.top,
    stroke: 'var(--axis)', 'stroke-width': 1 }));
  wrap.appendChild(svg);
  return wrap;
}

function histogram(dist, height = 180) {
  const { edges, counts } = dist;
  const maxCount = Math.max(...counts, 1);
  const iw = BW - BPAD.left - BPAD.right, ih = height - BPAD.top - BPAD.bottom;
  const bw = iw / counts.length;

  // A managed position produces a genuine point mass -- every path that hits
  // the profit target exits at the same P/L -- so one bucket can hold most of
  // the distribution and a linear count axis flattens the losses to nothing.
  // Those losses are the part that decides survivability, so when one bucket
  // dwarfs the rest the count axis switches to a square root scale. Ticks keep
  // true counts and the legend says what the axis is doing: a rescaled axis
  // presented as linear would be a lie about magnitude.
  const nonZero = counts.filter((c) => c > 0).sort((a, b) => a - b);
  const typical = nonZero.length ? nonZero[Math.floor(nonZero.length / 2)] : 1;
  const compress = maxCount > typical * 20;
  const scaleC = (c) => (compress ? Math.sqrt(c) / Math.sqrt(maxCount) : c / maxCount);

  const wrap = el('div', 'chart-wrap');
  const svg = svgEl('svg', { viewBox: `0 0 ${BW} ${height}`, role: 'img',
    'aria-label': 'Distribution of trade profit and loss' });

  for (const t of ticks(0, maxCount, 4)) {
    const y = BPAD.top + ih - scaleC(t) * ih;
    svg.appendChild(svgEl('line', { class: 'grid-line', x1: BPAD.left, x2: BW - BPAD.right, y1: y, y2: y }));
    const tx = svgEl('text', { class: 'axis-label', x: BPAD.left - 8, y: y + 3.5, 'text-anchor': 'end' });
    tx.textContent = t.toFixed(0);
    svg.appendChild(tx);
  }

  const tip = el('div', 'tooltip');
  tip.style.display = 'none';

  counts.forEach((c, i) => {
    const h = scaleC(c) * ih;
    const mid = (edges[i] + edges[i + 1]) / 2;
    const rect = svgEl('rect', {
      x: BPAD.left + i * bw + 1, y: BPAD.top + ih - h,
      width: Math.max(bw - 2, 1), height: Math.max(h, c > 0 ? 2 : 0), rx: 2,
      fill: mid >= 0 ? 'var(--status-good)' : 'var(--status-critical)', opacity: 0.8 });
    rect.addEventListener('mouseenter', () => {
      tip.style.display = ''; tip.style.right = '16px'; tip.style.top = '8px';
      tip.innerHTML = `<div class="tt-head">${money(edges[i])} to ${money(edges[i + 1])}</div>` +
        `<div class="tt-row"><span>Trades</span><strong>${c}</strong></div>`;
    });
    svg.appendChild(rect);
  });

  svg.appendChild(svgEl('line', { class: 'axis-line', x1: BPAD.left, x2: BW - BPAD.right,
    y1: BPAD.top + ih, y2: BPAD.top + ih }));
  const every = Math.max(1, Math.floor(counts.length / 6));
  counts.forEach((_, i) => {
    if (i % every) return;
    const t = svgEl('text', { class: 'axis-label', x: BPAD.left + i * bw + bw / 2,
      y: height - BPAD.bottom + 15, 'text-anchor': 'middle' });
    t.textContent = money(edges[i]);
    svg.appendChild(t);
  });
  const ax = svgEl('text', { class: 'axis-label', x: (BPAD.left + BW - BPAD.right) / 2,
    y: height - 3, 'text-anchor': 'middle' });
  ax.textContent = 'profit / loss per trade';
  svg.appendChild(ax);

  wrap.append(svg, tip);
  wrap.onmouseleave = () => { tip.style.display = 'none'; };
  return wrap;
}


/* ================================================================ THEMES */
/*
 * Same four themes as the web app, driven by the same `data-theme` attribute
 * and the same validated tokens (tools/palette_check.py runs against this
 * stylesheet too).
 *
 * The choice is held in memory rather than localStorage on purpose: this file
 * is delivered as a standalone artifact and browser storage is not available
 * to it. The cost is that the theme resets on reload, which is the honest
 * trade for a single self-contained document.
 */

const THEMES = [
  ['dark-blue', 'Dark blue', 'Near-black with a blue cast. The default.'],
  ['light-black', 'Light black', 'Neutral dark grey, a step lighter. Easier in a bright room.'],
  ['eggshell', 'Eggshell', 'Warm off-white. Reads as paper rather than as a screen.'],
  ['glass', 'Liquid glass', 'Translucent panels over a fixed gradient.'],
];

function themeSwatch(id) {
  // Reads the theme's REAL tokens by probing a detached element carrying the
  // attribute. A hard-coded swatch is a copy of the palette, and a copy of the
  // palette is a swatch that goes stale the first time a colour changes.
  const probe = el('div');
  probe.setAttribute('data-theme', id);
  probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  const cols = ['--surface-1', '--series-1', '--series-2', '--status-good', '--status-critical']
    .map((t) => cs.getPropertyValue(t).trim());
  probe.remove();

  const sw = el('span', 'theme-swatch');
  sw.setAttribute('data-theme', id);
  sw.innerHTML = cols.map((c) => `<span style="background:${c}"></span>`).join('');
  return sw;
}

function settingsControl() {
  const wrap = el('div', 'settings');
  const btn = el('button', 'btn ghost',
    '<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden fill="none" ' +

/* ========================================================== CANDLE CHART */
/*
 * The same chart the app draws from /api/tv/history. Here it reads the bundled
 * bars, which are the identical series the backtests and forecasts in this file
 * were computed from -- so the chart and the numbers cannot disagree.
 */

function candleChart(bars, symbol, height = 380) {
  const W = 1000, PAD = { top: 14, right: 62, bottom: 22, left: 34 }, VOL_H = 54;
  if (!bars || bars.length < 2) return el('div', 'skeleton');
  const lo = Math.min(...bars.map((b) => b.l)), hi = Math.max(...bars.map((b) => b.h));
  const pad = (hi - lo) * 0.06 || 1, yLo = lo - pad, yHi = hi + pad;
  const priceH = height - PAD.top - PAD.bottom - VOL_H;
  const step = (W - PAD.left - PAD.right) / bars.length;
  const bw = Math.max(1, Math.min(11, step * 0.68));
  const x = (i) => PAD.left + i * step + step / 2;
  const y = (v) => PAD.top + priceH - ((v - yLo) / (yHi - yLo)) * priceH;
  const maxVol = Math.max(...bars.map((b) => b.v), 1);
  const volTop = PAD.top + priceH + 12;

  const wrap = el('div', 'chart-wrap');
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${height}`, role: 'img',
    'aria-label': `${symbol} daily candles with volume` });

  for (const t of ticks(yLo, yHi, 5)) {
    svg.appendChild(svgEl('line', { class: 'grid-line', x1: PAD.left, x2: W - PAD.right, y1: y(t), y2: y(t) }));
    const lab = svgEl('text', { class: 'axis-label', x: W - PAD.right + 6, y: y(t) + 3.5 });
    lab.textContent = numS(t); svg.appendChild(lab);
  }
  bars.forEach((b, i) => {
    const col = b.c >= b.o ? 'var(--status-good)' : 'var(--status-critical)';
    svg.appendChild(svgEl('line', { x1: x(i), x2: x(i), y1: y(b.h), y2: y(b.l), stroke: col, 'stroke-width': 1 }));
    svg.appendChild(svgEl('rect', { x: x(i) - bw / 2, y: Math.min(y(b.o), y(b.c)),
      width: bw, height: Math.max(1, Math.abs(y(b.c) - y(b.o))), fill: col }));
    const vh = (b.v / maxVol) * (VOL_H - 8);
    svg.appendChild(svgEl('rect', { x: x(i) - bw / 2, y: volTop + (VOL_H - 8) - vh,
      width: bw, height: vh, fill: col, opacity: 0.32 }));
  });
  svg.appendChild(svgEl('line', { class: 'axis-line', x1: PAD.left, x2: W - PAD.right,
    y1: PAD.top + priceH, y2: PAD.top + priceH }));
  const stride = Math.max(1, Math.floor(bars.length / 7));
  bars.forEach((b, i) => {
    if (i % stride) return;
    const lab = svgEl('text', { class: 'axis-label', x: x(i), y: height - 6, 'text-anchor': 'middle' });
    lab.textContent = b.d || ''; svg.appendChild(lab);
  });
  wrap.appendChild(svg);
  return wrap;
}

/*
 * TradingView embeds inside the standalone document.
 *
 * The rest of this file is a snapshot: everything it shows was computed at
 * build time and frozen. These widgets are the exception — they are fetched
 * live from TradingView's CDN when the file is opened, so this one panel shows
 * real market data even though the document itself is offline. That difference
 * is stated on the page, because a live chart sitting above generated numbers
 * is exactly the kind of thing someone would otherwise read across.
 *
 * Mirrors components/TradingView.tsx: same three states, same six-second
 * iframe poll, same reason — a blank rectangle is indistinguishable from a
 * broken page.
 */
function tvWidget(kind, config, height, label) {
  const wrap = el('div');
  wrap.style.cssText = `position:relative;height:${height}px`;
  const host = el('div');
  host.style.height = '100%';
  const overlay = el('div', 'tv-overlay');
  const short = height < 140;
  overlay.innerHTML = short
    ? `<span class="tiny muted"><span class="pulse-dot"></span> loading ${label}…</span>`
    : `<span class="tiny muted"><span class="pulse-dot"></span> loading ${label} from s3.tradingview.com…</span>`;
  wrap.appendChild(host);
  wrap.appendChild(overlay);

  const container = el('div', 'tradingview-widget-container');
  container.style.height = '100%';
  const inner = el('div', 'tradingview-widget-container__widget');
  inner.style.height = '100%';
  container.appendChild(inner);

  const theme = document.documentElement.getAttribute('data-theme') === 'eggshell'
    ? 'light' : 'dark';
  const script = document.createElement('script');
  script.src = 'https://s3.tradingview.com/external-embedding/' + kind;
  script.async = true;
  script.type = 'text/javascript';
  script.innerHTML = JSON.stringify(Object.assign({}, config, { theme, locale: 'en' }));

  const fail = () => {
    overlay.innerHTML = short
      ? `<span class="tiny muted">${label} did not load — <code>s3.tradingview.com</code> is unreachable.</span>`
      : `<div class="empty-state"><strong>${label} did not load.</strong><p>It is fetched from ` +
        `<code>s3.tradingview.com</code> when this file is opened, so it needs a context that ` +
        `allows third-party scripts. If you are reading this inside a chat preview pane, that ` +
        `is the cause — previews block external scripts. <b>Download this file and open it in ` +
        `your browser</b> and the live TradingView panels render. Otherwise: an ad blocker, a ` +
        `network policy, or being offline. Every other panel here is a build-time snapshot ` +
        `and keeps working.</p></div>`;
  };
  let settled = false;
  const poll = setInterval(() => {
    if (settled) return;
    if (inner.querySelector('iframe')) { settled = true; clearInterval(poll); overlay.remove(); }
  }, 250);
  setTimeout(() => {
    if (settled) return;
    settled = true; clearInterval(poll);
    if (inner.querySelector('iframe')) overlay.remove(); else fail();
  }, 6000);
  script.onerror = () => { settled = true; clearInterval(poll); fail(); };

  container.appendChild(script);
  host.appendChild(container);
  return wrap;
}

      const a = Math.abs(n);

      if (a >= 1e9) return (n / 1e9).toFixed(2) + 'B';

      volatility: 'M3 12h3l3-7 4 14 3-7h5', support: 'M4 18h16M8 14l4 4 4-4',

    const shead = el('div', 'scan-head', `<strong>Series scan · ${sym}</strong>`);

    sheet.appendChild(list);
    sheet.appendChild(el('p', 'scan-note', sc.note));

  term.appendChild(symCol);

  /* Execution: locked, with the real adapter states behind it. */
